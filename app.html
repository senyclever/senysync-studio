<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0a0a12">
<title>SenySync Studio - AI Music Video 4-in-1 · By Seny Clever</title>
<style>
:root{--bg:#070711;--bg2:#0a0a12;--panel:#12121f;--panel2:#181828;--panel3:#1e1e30;--border:#2a2a45;--cyan:#00e5ff;--magenta:#ff2e88;--green:#39ff8e;--amber:#ffb454;--txt:#d8d8e8;--dim:#8888a8;--danger:#ff4d5e;--scrim:rgba(0,0,0,.72);--mono:Consolas,'DejaVu Sans Mono','Courier New',monospace;--sans:'Segoe UI',system-ui,-apple-system,sans-serif;--fs:14px;--rad:10px}
body.day{--bg:#e8edf5;--bg2:#f2f5fa;--panel:#ffffff;--panel2:#e2e8f2;--panel3:#cfd9e8;--border:#7d8fa9;--cyan:#00567e;--magenta:#9c0f4a;--green:#0f5c26;--amber:#7a4300;--txt:#0a1220;--dim:#333d4f;--danger:#a3001b;--scrim:rgba(10,18,32,.55)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;scrollbar-width:thin;scrollbar-color:var(--cyan) var(--panel2)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--panel2);border-radius:8px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--cyan),var(--magenta));border-radius:8px;border:2px solid var(--panel2)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--magenta),var(--cyan))}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:var(--fs);line-height:1.5;background-image:radial-gradient(1100px 560px at 12% -10%,rgba(0,229,255,.10),transparent 60%),radial-gradient(950px 650px at 100% 110%,rgba(255,46,136,.10),transparent 55%),linear-gradient(180deg,var(--bg2),var(--bg));background-attachment:fixed;padding-bottom:30px}
body.day{background-image:linear-gradient(180deg,var(--bg2),var(--bg))}
.mono{font-family:var(--mono)}.dim{color:var(--dim)}
#bootErr{display:none;background:#2a0a12;border-bottom:2px solid var(--danger);color:#ff9aab;font-family:var(--mono);font-size:12px;padding:12px 16px;white-space:pre-wrap}
header{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(18,18,31,.96),rgba(10,10,18,.94));backdrop-filter:blur(14px);flex-wrap:wrap}
body.day header{background:#ffffff;border-bottom:2px solid var(--border)}
.brand h1{font-size:17px;color:var(--cyan);text-shadow:0 0 14px rgba(0,229,255,.35)}
body.day .brand h1{text-shadow:none;font-weight:800}
.brand .slogan{font-size:10px;color:var(--dim);letter-spacing:1.4px;text-transform:uppercase}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{background:var(--panel2);border:1px solid var(--border);color:var(--txt);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:border-color .15s,color .15s,transform .05s}
button:hover{border-color:var(--cyan);color:var(--cyan)}
button:active{transform:translateY(1px)}
button.primary{background:rgba(0,229,255,.12);border-color:var(--cyan);color:var(--cyan)}
button.mag{background:rgba(255,46,136,.12);border-color:var(--magenta);color:var(--magenta)}
button.good{background:rgba(57,255,142,.12);border-color:var(--green);color:var(--green)}
button.warn{background:rgba(255,180,84,.12);border-color:var(--amber);color:var(--amber)}
button.small{padding:4px 8px;font-size:11px;min-height:28px}
button.big{min-height:50px;font-size:16px;padding:10px 14px}
button.on{background:rgba(57,255,142,.15);border-color:var(--green);color:var(--green)}
button:disabled{opacity:.4;cursor:not-allowed}
button svg{flex-shrink:0}
body.day button{border-width:1.5px;font-weight:600}
body.day button.primary{background:#dceefb}body.day button.mag{background:#fbe0ec}body.day button.good{background:#ddf2e3}body.day button.warn{background:#fbeed7}body.day button.on{background:#ddf2e3}
.wrap{max-width:1440px;margin:0 auto;padding:12px 16px}
.statusbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:var(--rad);padding:8px 14px;margin:10px auto;max-width:1440px;font-size:11px}
.statusbar b{font-family:var(--mono);color:var(--cyan)}
#saveDot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block;transition:background .3s}
#saveDot.on{background:var(--green)}
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--border);margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.tab{padding:10px 13px;cursor:pointer;color:var(--dim);border:1px solid transparent;border-bottom:none;border-radius:9px 9px 0 0;font-size:12px;white-space:nowrap;user-select:none}
.tab:hover{color:var(--txt)}
.tab.active{color:var(--cyan);background:var(--panel);border-color:var(--border);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--rad);padding:14px;margin-bottom:12px}
.panel h3{margin-bottom:10px;color:var(--cyan);font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.panel h3 .byline{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;align-items:flex-end}
.row.gap{margin-top:16px}
.field{display:flex;flex-direction:column;gap:3px;min-width:110px;flex:1}
.field label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:4px;font-weight:600}
input,select,textarea{background:var(--panel2);border:1px solid var(--border);color:var(--txt);padding:9px 10px;border-radius:7px;font-size:13px;font-family:inherit;width:100%}
textarea{font-family:var(--mono);font-size:12px;resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--cyan);cursor:pointer}
input[type=range]{accent-color:var(--cyan);padding:0;height:26px}
input[type=color]{padding:2px;height:38px;cursor:pointer}
select optgroup{background:var(--panel3);color:var(--cyan);font-style:normal;font-weight:600}
select option{background:var(--panel2);color:var(--txt)}
.hint{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.45}
.tip{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;min-height:17px;padding:0;border:none;border-radius:50%;background:rgba(0,229,255,.18);color:var(--cyan);font-size:9px;cursor:pointer;flex-shrink:0;font-weight:700;font-family:inherit}
.tip:hover{background:rgba(0,229,255,.34);color:var(--cyan)}
.tip:focus{outline:2px solid var(--cyan);outline-offset:2px}
.tooltip{display:none;position:fixed;background:var(--panel3);border:1px solid var(--cyan);color:var(--txt);padding:10px 13px;border-radius:9px;font-size:11px;white-space:pre-line;max-width:340px;z-index:300;pointer-events:none;line-height:1.5;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.card{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:11px;margin-bottom:8px}
.card h4{color:var(--cyan);font-size:12px;margin-bottom:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .meta{font-size:10px;font-family:var(--mono);color:var(--dim);margin:4px 0}
.card .desc{font-size:11px;color:var(--dim);white-space:pre-line}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--panel3);border:1px solid var(--border);border-radius:20px;padding:3px 9px;font-size:10px;margin:2px}
.chip .x{cursor:pointer;color:var(--danger);font-weight:bold}
.edot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.warnbox{background:rgba(255,180,84,.08);border-left:3px solid var(--amber);padding:8px 11px;border-radius:0 8px 8px 0;margin-bottom:7px;font-size:12px;color:var(--amber)}
.okbox{background:rgba(57,255,142,.07);border-left:3px solid var(--green);padding:8px 11px;border-radius:0 8px 8px 0;margin-bottom:7px;font-size:12px;color:var(--green)}
.errbox{background:rgba(255,77,94,.08);border-left:3px solid var(--danger);padding:8px 11px;border-radius:0 8px 8px 0;margin-bottom:7px;font-size:12px;color:var(--danger)}
.infobox{background:rgba(0,229,255,.07);border-left:3px solid var(--cyan);padding:8px 11px;border-radius:0 8px 8px 0;margin-bottom:7px;font-size:12px;color:var(--cyan)}
body.day .warnbox{background:#fbeed7}body.day .okbox{background:#ddf2e3}body.day .errbox{background:#fbe3e6}body.day .infobox{background:#dceefb}
.dash{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--dim);background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;margin-bottom:10px}
.dash b{color:var(--cyan);font-family:var(--mono)}
.tl-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin-top:10px}
.tl-controls button{min-height:48px;font-size:13px;padding:10px 8px}
.tl-transport{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.tl-transport button{min-width:60px;min-height:52px;font-size:16px;padding:10px 12px}
.tl-time{display:contents}
.tl-wrap{position:relative;width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:9px;overflow:hidden;touch-action:none;user-select:none;cursor:crosshair}
.tl-wrap canvas{display:block;width:100%}
.tl-sb{height:32px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;margin-top:9px;position:relative;cursor:pointer;touch-action:none}
.tl-thumb{height:100%;background:linear-gradient(90deg,rgba(0,229,255,.4),rgba(255,46,136,.4));border-radius:9px;min-width:50px;position:absolute;top:0;cursor:grab}
.tl-zoom{display:flex;align-items:center;gap:8px;margin-top:8px}
.tl-zoom input[type=range]{flex:1}
.export-card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:13px;display:flex;flex-direction:column;gap:7px}
.export-card h4{color:var(--cyan);font-size:12px}
.export-card p{font-size:11px;color:var(--dim);flex:1}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hint + .btn-row{margin-top:10px}
.modal{position:fixed;inset:0;background:var(--scrim);z-index:200;display:none;align-items:center;justify-content:center;padding:14px}
.modal.show{display:flex}
.mbox{background:var(--panel);border:1px solid var(--cyan);border-radius:13px;padding:17px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;overscroll-behavior:contain}
.mbox.wide{max-width:900px}
.mbox h3{color:var(--cyan);margin-bottom:10px;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.tp-cols{display:flex;gap:16px;justify-content:center;margin:10px 0}
.tp-col{display:flex;flex-direction:column;align-items:center;gap:5px}
.tp-col label{font-size:10px;color:var(--dim);text-transform:uppercase}
.tp-val{font-family:var(--mono);font-size:24px;color:var(--cyan);background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:8px 12px;min-width:76px;text-align:center;cursor:ns-resize;user-select:none}
.tp-val input{width:62px;background:transparent;border:none;color:var(--cyan);font-family:var(--mono);font-size:24px;text-align:center;padding:0}
#tpBox button{touch-action:none;user-select:none}
.tp-preview{text-align:center;font-family:var(--mono);font-size:17px;color:var(--green);margin:8px 0}
.notif{position:fixed;top:0;right:0;width:360px;max-width:100vw;height:100%;background:var(--panel);border-left:1px solid var(--border);z-index:250;display:none;flex-direction:column}
.notif.show{display:flex}
.notif h3{padding:12px;border-bottom:1px solid var(--border);color:var(--cyan);font-size:13px;display:flex;justify-content:space-between;align-items:center}
.notif-list{flex:1;overflow-y:auto;padding:10px}
.notif-item{padding:8px 6px;border-bottom:1px solid rgba(42,42,69,.4);font-size:11px}
.notif-item .t{color:var(--dim);font-size:10px;font-family:var(--mono)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel3);border:1px solid var(--green);color:var(--green);padding:11px 18px;border-radius:9px;z-index:400;opacity:0;transition:.25s;pointer-events:none;max-width:92vw;font-size:13px;text-align:center}
.toast.show{opacity:1}
body.mtrans .toast{bottom:86px}
.cover-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.cover-item{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px}
.cover-item .thumb{width:100%;aspect-ratio:16/10;background:var(--bg);border-radius:7px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.cover-item .thumb canvas{width:100%;height:100%;object-fit:contain;display:block}
.cover-item h4{font-size:12px;color:var(--cyan);margin-bottom:4px}
.cover-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cover-actions button{min-height:44px;font-size:12px}
.render-stage{background:#000;border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:180px}
.render-stage canvas{width:100%;height:auto;max-height:70vh;object-fit:contain;display:block}
.render-stage:fullscreen canvas{max-height:100vh;width:100%;height:100%}
.knob-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin-top:6px}
.knob{display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:pan-y;user-select:none;cursor:ew-resize;padding:4px;border-radius:9px}
.knob:hover{background:var(--panel2)}
.knob:focus{outline:1px solid var(--cyan)}
.knob svg{width:62px;height:62px;display:block;pointer-events:none}
.knob-val{font-family:var(--mono);font-size:12px;color:var(--cyan);pointer-events:none}
.knob-lbl{font-size:9px;color:var(--dim);text-transform:uppercase;text-align:center;line-height:1.2;font-weight:600;pointer-events:none}
.anchor-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:240px;margin-top:4px}
.anchor-pad button{min-height:40px;font-size:15px}
.fx-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.fx-title{font-size:11px;color:var(--cyan);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 6px;font-weight:700}
#lightbox{position:fixed;inset:0;z-index:450;background:rgba(0,0,0,.94);display:none;flex-direction:column}
#lightbox.show{display:flex}
.lb-bar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel)}
.lb-bar h4{color:var(--cyan);font-size:13px;flex:1}
.lb-stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px}
.lb-stage canvas{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.hero{background:linear-gradient(135deg,rgba(0,229,255,.10),rgba(255,46,136,.10));border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:14px}
.hero h2{font-size:clamp(22px,4vw,34px);background:linear-gradient(90deg,var(--cyan),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
body.day .hero h2{background:none;color:var(--cyan);-webkit-background-clip:initial}
.hero p{color:var(--dim);max-width:760px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:14px}
.flow div{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:10px;font-size:11px}
.flow b{display:block;color:var(--cyan);font-size:12px;margin-bottom:3px}
.imp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.imp-stat{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px;text-align:center}
.imp-stat b{display:block;font-family:var(--mono);font-size:18px;color:var(--cyan)}
.imp-stat span{font-size:10px;color:var(--dim);text-transform:uppercase}
.dropzone{border:2px dashed var(--border);border-radius:12px;padding:18px;text-align:center;background:var(--panel2);margin:8px 0;cursor:pointer}
.dropzone:hover{border-color:var(--cyan)}
#dropOverlay{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;background:rgba(7,7,17,.86);backdrop-filter:blur(6px)}
#dropOverlay.show{display:flex}
#dropOverlay .inner{border:3px dashed var(--cyan);border-radius:18px;padding:40px 60px;text-align:center;background:var(--panel)}
#dropOverlay h2{color:var(--cyan);font-size:22px;margin-bottom:8px}
footer{text-align:center;color:var(--dim);font-size:10px;padding:16px}
#mTransport{position:fixed;left:0;right:0;bottom:0;z-index:120;display:none;align-items:center;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:2px solid var(--border);box-shadow:0 -6px 24px rgba(0,0,0,.35)}
body.mtrans #mTransport{display:flex}
body.mtrans{padding-bottom:86px}
#mTransport button{flex:1 1 0;min-width:44px;min-height:52px;font-size:17px;padding:8px 4px;overflow:hidden}
body.immersive header,body.immersive .statusbar,body.immersive .tabs,body.immersive #warnings,body.immersive footer{display:none}
body.immersive .wrap{padding:6px;max-width:none}
body.immersive .panel{margin-bottom:6px}
.reorder{display:inline-flex;gap:2px;margin-right:4px}
.reorder button{min-width:34px;min-height:34px;padding:4px}
#helpSheet{position:fixed;inset:0;z-index:470;display:none;background:var(--scrim);align-items:flex-end;justify-content:center}
#helpSheet.show{display:flex}
#helpBox{background:var(--panel);border:1px solid var(--cyan);border-radius:14px 14px 0 0;width:100%;max-width:720px;max-height:84vh;overflow-y:auto;padding:16px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.5);overscroll-behavior:contain}
#helpBox h3{color:var(--cyan);font-size:15px;margin-bottom:8px}
#helpBox .hb{white-space:pre-line;font-size:13px;line-height:1.62;color:var(--txt)}
#helpBox .hk{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:10px}
.mbadge{display:inline-flex;align-items:center;gap:5px;background:var(--panel3);border:1px solid var(--border);border-radius:20px;padding:3px 9px;font-size:10px;font-family:var(--mono);margin:2px}
.mbadge.ok{border-color:var(--green);color:var(--green)}
.mbadge.warn{border-color:var(--amber);color:var(--amber)}
.mbadge.bad{border-color:var(--danger);color:var(--danger)}
.stagebar{display:flex;gap:3px;flex-wrap:wrap;margin:6px 0}
.stagebar button{min-height:32px;padding:3px 8px;font-size:10px;border-radius:16px}
.st0{--sc:var(--dim)}.st1{--sc:var(--cyan)}.st2{--sc:var(--amber)}.st3{--sc:var(--green)}.st4{--sc:var(--danger)}
.stagebar button.on{border-color:var(--sc);color:var(--sc);background:transparent;font-weight:800}
.progline{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;display:flex;margin:6px 0}
.progline i{display:block;height:100%}
.refgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.refcard{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:8px}
.refcard .ph{width:100%;aspect-ratio:1/1;background:var(--bg);border-radius:7px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.refcard .ph img{width:100%;height:100%;object-fit:contain;display:block}
.refcard h5{font-size:11px;color:var(--cyan);margin-bottom:3px;word-break:break-all}
.upcard{background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--cyan);border-radius:8px;padding:9px;margin-bottom:7px}
.upcard h5{font-size:12px;color:var(--cyan);margin-bottom:3px}
