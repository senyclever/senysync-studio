var HELP={
timeline:{es:{t:'🎵 Timeline · el eje maestro',b:'Bandas de arriba a abajo: Secciones · Escenas · Clips · Líneas · [Motivo] · [Planos] · Onda · Beats/CSV · Regleta.\nCÓMO SE CONECTA: todo lo que creas aquí alimenta los prompts, los subtítulos y el render. Si mueves un clip, viajan su prompt y su escena SVG.\nGESTOS: rueda = zoom · Alt/Shift+rueda = scroll · dos dedos = pinch · pulsación larga = menú contextual · doble tap = zoom a la selección · vibración al enganchar un snap.\nATAJOS: L línea · M sección · S escena · C clip (dos pulsaciones: inicio y fin).\nCONTROLES: Sección · Línea · Escena · Clip · Snap (cíclico) · Candado D · Metrónomo · Motivo · Planos · CSV · Leyenda · Atajos · Seguir aguja.\nERROR COMÚN: arrastrar en vertical sobre el lienzo no hace scroll de página; el Timeline captura el gesto. Haz scroll fuera del lienzo.'},en:{t:'🎵 Timeline · the master axis',b:'Bands top to bottom: Sections · Scenes · Clips · Lines · [Motif] · [Shots] · Waveform · Beats/CSV · Ruler.\nHOW IT CONNECTS: everything you create here feeds prompts, subtitles and the render. Moving a clip moves its prompt and its linked SVG scene.\nGESTURES: wheel = zoom · Alt/Shift+wheel = scroll · two fingers = pinch · long press = context menu · double tap = zoom to selection · vibration on snap.\nSHORTCUTS: L line · M section · S scene · C clip (two presses: start and end).\nCONTROLS: Section · Line · Scene · Clip · Snap (cycled) · Lock D · Metronome · Motif · Shots · CSV · Legend · Shortcuts · Follow playhead.\nCOMMON MISTAKE: dragging vertically over the canvas does not scroll the page; the Timeline captures the gesture. Scroll outside the canvas.'}},
clips:{es:{t:'🎞 Clips · prompts y producción',b:'Cada clip es una unidad de trabajo para la IA: tiempo, frames, estética, prompt, escena SVG, motivo, planos y referencias.\nCHECKLIST: marca el estado real (Pendiente → Enviado → Generado → Aprobado / Descartado) para saber qué falta sin llevar la cuenta de memoria.\nREFERENCIAS: la tarjeta lista qué imágenes adjuntar y con qué rol. Adjunta solo lo que aparece ahí.\nERROR COMÚN: pulsar Generar después de importar un guion de IA en modo rellenar. Eso re-particiona y destruye los tiempos importados.'},en:{t:'🎞 Clips · prompts and production',b:'Each clip is a unit of work for the AI: time, frames, aesthetic, prompt, SVG scene, motif, shots and references.\nCHECKLIST: mark the real stage (Pending → Sent → Generated → Approved / Rejected) so you know what is left without counting in your head.\nREFERENCES: the card lists which images to attach and with which role. Attach only what appears there.\nCOMMON MISTAKE: pressing Generate after importing an AI script in fill mode. That re-partitions and destroys imported timing.'}},
reorder:{es:{t:'↑↓ Reordenar clips',b:'Dos modos, y la app siempre pregunta antes:\n1) INTERCAMBIAR CONTENIDO — los tiempos NO se mueven. Viajan prompt, estética, escena SVG, motivo, planos, estado y referencias. Música, subtítulos y frames intactos. Riesgo cero.\n2) MOVER EN EL TIEMPO — los clips intercambian posición conservando cada uno su duración. Se recalculan fronteras, sección, escena y enlaces first-frame. No crea huecos ni rompe el techo D.\nElige 1 para reordenar la narración. Elige 2 cuando el clip debe caer en otro momento de la canción. Ctrl+Z revierte ambos.'},en:{t:'↑↓ Reordering clips',b:'Two modes, and the app always asks first:\n1) SWAP CONTENT — times do NOT move. Prompt, aesthetic, SVG scene, motif, shots, stage and references travel. Music, subtitles and frames stay intact. Zero risk.\n2) MOVE IN TIME — clips exchange position while each keeps its duration. Boundaries, section, scene and first-frame links are recomputed. No gaps, ceiling D preserved.\nPick 1 to reorder the narrative. Pick 2 when the clip must land on another moment of the song. Ctrl+Z undoes both.'}},
split:{es:{t:'✂ Partir un clip',b:'Divide un clip demasiado largo en dos, sin perder cobertura del Timeline.\nDÓNDE CORTAR: en el beat más cercano, en el compás más cercano, donde empieza una línea de letra, o en un punto manual. Cortar en frontera musical evita que el corte caiga a mitad de una palabra o de un golpe.\nQUÉ MIGRA: estética, referencias, motivo, planos, notas y estado. La escena SVG puede duplicarse en ambos o dejar el segundo pendiente de arte nuevo.\nESTADO: el resultado vuelve a Pendiente por defecto, porque partir cambia el resultado que la IA debe generar.'},en:{t:'✂ Splitting a clip',b:'Divides an over-long clip in two without losing Timeline coverage.\nWHERE TO CUT: at the nearest beat, the nearest bar, where a lyric line starts, or at a manual point. Cutting on a musical boundary avoids landing mid-word or mid-hit.\nWHAT MIGRATES: aesthetic, references, motif, shots, notes and stage. The SVG scene can be duplicated into both or left pending on the second.\nSTAGE: the result returns to Pending by default, because splitting changes what the AI must generate.'}},
stages:{es:{t:'✅ Estados de producción',b:'PENDIENTE: aún no lo pides a la IA.\nENVIADO: prompt enviado, esperando resultado (cuota diaria).\nGENERADO: ya tienes el archivo o la escena.\nAPROBADO: pasó tu revisión de estilo y continuidad.\nDESCARTADO: hay que rehacerlo; guarda el motivo en la nota.\nLa barra de progreso suma solo APROBADOS, porque es lo único realmente terminado.\nCONSEJO: filtra por pendientes antes de cada sesión de generación.'},en:{t:'✅ Production stages',b:'PENDING: not requested from the AI yet.\nSENT: prompt sent, awaiting result (daily quota).\nGENERATED: you already have the file or scene.\nAPPROVED: it passed your style and continuity review.\nREJECTED: must be redone; keep the reason in the note.\nThe progress bar counts APPROVED only, because that is the only truly finished work.\nTIP: filter by pending before each generation session.'}},
sentinels:{es:{t:'★ Centinelas antes del lote',b:'No generes 33 clips a ciegas. Marca tres centinelas: un héroe con su escenario, una entidad en caos y el clímax.\nSi los tres pasan tu revisión de estilo, canon y color, el resto del lote saldrá coherente. Si alguno falla, corriges la biblia antes de gastar cuota.\nLos centinelas NO son clips nuevos: son marcas sobre clips existentes, así el Timeline no se rompe.\nExportar solo centinelas conserva los IDs originales para que la respuesta de la IA encaje al importar. Atajo: Alt+S.'},en:{t:'★ Sentinels before the batch',b:'Do not generate 33 clips blind. Mark three sentinels: a hero with its set, an entity in chaos and the climax.\nIf all three pass your style, canon and color review, the rest of the batch will be coherent. If one fails, you fix the bible before spending quota.\nSentinels are NOT new clips: they are flags on existing clips, so the Timeline never breaks.\nExporting only sentinels keeps the original IDs so the AI reply fits on import. Shortcut: Alt+S.'}},
motif:{es:{t:'🎯 Fila de motivo',b:'Es un mapa de continuidad del símbolo recurrente de tu historia (por ejemplo un ojo rojo). No dibuja nada: te dice dónde aparece y con qué intensidad.\nCOLORES FIJOS: los 12 códigos M0–M11 tienen siempre el mismo color y el mismo icono en todos los proyectos, para que la fila se lea igual y la IA use un vocabulario estable.\nSIGNIFICADO PERSONALIZABLE: la descripción de cada código la escribes tú o la define la IA de texto y llega en el JSON. Pulsa Leyenda para verlas y editarlas.\nOJO: estos colores son del Timeline, no del arte. El motivo puede ser rojo en el SVG y estar marcado como M7 magenta aquí.\nERROR COMÚN: usar M11 Excepción más de una vez. La app avisa.'},en:{t:'🎯 Motif lane',b:'A continuity map of the recurring symbol of your story (for example a red eye). It draws nothing: it tells you where it appears and how strongly.\nFIXED COLORS: the 12 codes M0–M11 always keep the same color and glyph in every project, so the lane reads the same and the AI uses a stable vocabulary.\nCUSTOM MEANING: the description of each code is written by you or defined by the text AI and arrives in the JSON. Press Legend to see and edit them.\nNOTE: these colors belong to the Timeline, not to the art. The motif can be red in the SVG and flagged M7 magenta here.\nCOMMON MISTAKE: using M11 Exception more than once. The app warns.'}},
shots:{es:{t:'🎬 Fila de planos · guía completa',b:'QUÉ ES: una capa de clasificación cinematográfica por clip. No dibuja nada; etiqueta cada clip con un vocabulario cerrado para que tú y la IA hablen el mismo idioma de cámara y montaje, y para detectar problemas de ritmo visual.\n\nCÓMO SE USA: activa la fila (botón Planos o tecla V). Toca la fila sobre un clip para abrir su editor. Elige un valor por categoría; la app muestra la cadena en orden canónico SIZE / ANGLE / POV / CAST / MOVE / FUNC, omitiendo los neutros (PN, PF, SGL). Ejemplo: PM / ESC / FIJ = plano medio, sobre el hombro, fijo.\n\nORIGEN: lo ideal es que la IA de guion lo devuelva. La app puede inferirlo del prompt (lo marca como sugerido) o puedes fijarlo a mano. Q/W ciclan la escala del clip actual.\n\nA · ESCALA (qué tan cerca está la cámara del sujeto):\nGPG Gran Plano General: el paisaje domina; el sujeto es mínimo. Ubica el mundo y su escala.\nPG Plano General: el sujeto completo y su entorno se leen juntos.\nPGC Plano General Corto: el sujeto gana peso pero el entorno sigue presente.\nPC Plano Conjunto: varios sujetos en un mismo encuadre.\nPE Plano Entero: el cuerpo completo de pies a cabeza.\nPA Plano Americano: corta a la altura de rodillas; clásico del western.\nPML Plano Medio Largo: corta por debajo del pecho / cintura alta.\nPM Plano Medio: corta a la cintura; estándar de diálogo y rap.\nPMC Plano Medio Corto: corta a la altura del pecho.\nPP Primer Plano: rostro y hombros; emoción y mirada.\nPPP Primerísimo Primer Plano: solo el rostro (o parte); máxima intensidad.\nPD Plano Detalle: un objeto o parte concreta (mano, ojo, libro).\nPMX Plano Macro: detalle extremo (textura, gota, iris).\n\nB · ANGULACIÓN (altura e inclinación de la cámara):\nPN Normal: a la altura de los ojos; neutro.\nPIC Picado: cámara arriba mirando abajo; empequeñece o vulnera.\nCPC Contrapicado: cámara abajo mirando arriba; engrandece o amenaza.\nCEN Cenital: totalmente desde arriba.\nNAD Nadir: totalmente desde abajo.\nPH Holandés: horizonte inclinado; tensión o extrañeza.\nPRS A Ras de Suelo: cámara al nivel del piso.\n\nC · PUNTO DE VISTA (orientación del sujeto respecto a cámara):\nPF Frontal: de frente.\nP3Q Tres Cuartos: sujeto girado unos 45 grados.\nPRF De Perfil: de lado.\nPDS Dorsal: de espaldas.\nESC Escorzo / sobre el hombro: cámara detrás de un hombro mirando al otro sujeto.\nPOV Subjetivo: la cámara es los ojos de un personaje.\nPSB Semisubjetivo: cercano al POV pero mostrando parte del personaje.\nPOB Objetual: la cámara es los ojos de un objeto.\n\nD · SUJETOS EN CUADRO:\nSGL Individual: una persona.\n2SH Doble: dos.\n3SH Triple: tres.\nGRP Grupo: multitud o elenco.\n\nE · MOVIMIENTO:\nFIJ Fijo: cámara estática (trípode).\nDIN Con movimiento: hay desplazamiento o giro (push, pan, tilt, tracking, crane, orbit, handheld, zoom).\nSEC Plano Secuencia: toma larga sin cortes que recorre la acción.\n\nF · FUNCIÓN DE MONTAJE (para qué sirve el plano dentro del edit):\nMST Plano Máster: la toma amplia que cubre toda la escena y a la que volver cuando se pierde la geografía.\nEST Plano de Situación: establece lugar y tiempo al inicio de una escena.\nINS Plano Recurso / Inserto: un detalle que corta el ritmo o aporta información (objeto, mano).\nREA Plano de Reacción: muestra la respuesta emocional de un personaje a lo que acaba de pasar.\nCTP Contraplano: la cara opuesta de un diálogo (plano/contraplano).\n\nPARA QUÉ SIRVE: detectar monotonía (4+ clips seguidos con la misma escala), escenas nuevas sin EST, clímax sin PP/PPP, o exceso de planos sin función. Una buena secuencia alterna escalas, usa EST al entrar a un lugar, INS/REA para respirar y CTP en diálogos.\n\nCÓMO GRABARLO: decide primero la escala (qué quieres que se lea), luego la angulación (qué poder tiene el sujeto), luego el POV (desde quién miramos), cuántos sujetos, si la cámara se mueve, y por último la función de montaje. Esa cadena es exactamente lo que la fila guarda.\n\nNo es obligatoria: la fila está oculta hasta que la activas.'},en:{t:'🎬 Shots lane · complete guide',b:'WHAT IT IS: a per-clip cinematic classification layer. It draws nothing; it tags each clip with a closed vocabulary so you and the AI speak the same camera and editing language, and to spot visual-rhythm problems.\n\nHOW TO USE: enable the lane (Shots button or V key). Tap the lane over a clip to open its editor. Pick one value per category; the app shows the chain in canonical order SIZE / ANGLE / POV / CAST / MOVE / FUNC, omitting neutrals (PN, PF, SGL). Example: PM / ESC / FIJ = medium shot, over the shoulder, static.\n\nORIGIN: ideally the script AI returns it. The app can infer it from the prompt (marked as suggested) or you can set it by hand. Q/W cycle the scale of the current clip.\n\nA · SCALE (how close the camera is to the subject):\nGPG Extreme Wide: landscape dominates; subject tiny. Establishes the world and its scale.\nPG Wide: full subject and environment read together.\nPGC Medium Wide: subject gains weight but environment still present.\nPC Group Wide: several subjects in one frame.\nPE Full Shot: whole body head to toe.\nPA American Shot: cut at the knees; western classic.\nPML Medium Long: cut below the chest / high waist.\nPM Medium Shot: cut at the waist; dialogue and rap standard.\nPMC Medium Close-Up: cut at the chest.\nPP Close-Up: face and shoulders; emotion and gaze.\nPPP Extreme Close-Up: only the face (or part); maximum intensity.\nPD Detail Shot: a concrete object or part (hand, eye, book).\nPMX Macro: extreme detail (texture, drop, iris).\n\nB · ANGLE (camera height and tilt):\nPN Eye Level: neutral.\nPIC High Angle: camera above looking down; diminishes or exposes.\nCPC Low Angle: camera below looking up; empowers or threatens.\nCEN Top-Down: straight from above.\nNAD Nadir: straight from below.\nPH Dutch Angle: tilted horizon; tension or strangeness.\nPRS Ground Level: camera at floor level.\n\nC · POINT OF VIEW (subject orientation to camera):\nPF Frontal: facing camera.\nP3Q Three-Quarter: subject turned about 45 degrees.\nPRF Profile: side on.\nPDS Back View: from behind.\nESC Over the Shoulder: camera behind one shoulder looking at the other subject.\nPOV Point of View: camera is a character eyes.\nPSB Semi-Subjective: close to POV but showing part of the character.\nPOB Object POV: camera is an object eyes.\n\nD · SUBJECTS IN FRAME:\nSGL Single: one person.\n2SH Two-Shot: two.\n3SH Three-Shot: three.\nGRP Group: crowd or cast.\n\nE · MOVEMENT:\nFIJ Static: locked camera (tripod).\nDIN Dynamic: there is displacement or rotation (push, pan, tilt, tracking, crane, orbit, handheld, zoom).\nSEC Sequence Shot: long take without cuts that travels the action.\n\nF · EDITING FUNCTION (what the shot is for inside the edit):\nMST Master Shot: the wide take covering the whole scene, returned to when geography is lost.\nEST Establishing Shot: sets place and time at the start of a scene.\nINS Insert / Cutaway: a detail that breaks rhythm or adds information (object, hand).\nREA Reaction Shot: shows a character emotional response to what just happened.\nCTP Reverse Shot: the opposite side of a dialogue (shot/reverse-shot).\n\nWHAT IT IS FOR: spotting monotony (4+ consecutive clips with the same scale), new scenes without EST, climax without PP/PPP, or too many shots without function. A good sequence alternates scales, uses EST when entering a place, INS/REA to breathe and CTP in dialogue.\n\nHOW TO SHOOT IT: decide first the scale (what should read), then the angle (what power the subject has), then the POV (through whom we look), how many subjects, whether the camera moves, and finally the editing function. That chain is exactly what the lane stores.\n\nNot mandatory: the lane stays hidden until you enable it.'}},
refs:{es:{t:'🖼 Referencias · la regla de oro',b:'Aquí guardas las imágenes de personaje que adjuntas en la IA. La app NO puede adjuntarlas por ti: te dice exactamente cuáles tocar en cada clip y lleva la cuenta.\nROLES:\n• Solo personaje: se usa el diseño (rostro, ropa, alas, capucha). NUNCA se copia el fondo.\n• Personaje + entorno coincidente: el fondo de la ref coincide con el narrado y puede informar la atmósfera.\n• Solo entorno: la imagen define el mundo, no un personaje.\nVINCULAR: marca en qué clips aparece cada referencia. El JSON exportado incluye el manifiesto para que la IA no improvise.\nRESOLUCIÓN: cada tarjeta muestra el tamaño original de forma permanente, con aviso de reescalado.'},en:{t:'🖼 References · the golden rule',b:'Here you store the character images you attach in the AI. The app CANNOT attach them for you: it tells you exactly which ones apply to each clip and keeps count.\nROLES:\n• Character-only: the design is used (face, wardrobe, wings, hood). The background is NEVER copied.\n• Character + matching environment: the ref background matches the narrated one and may inform atmosphere.\n• Environment-only: the image defines the world, not a character.\nLINKING: mark which clips each reference appears in. The exported JSON includes the manifest so the AI does not improvise.\nRESOLUTION: every card permanently shows the original size with an upscale flag.'}},
refstore:{es:{t:'💾 Dónde vive el archivo',b:'INTERNO — la imagen o el SVG viajan dentro del proyecto. Un solo .json lo contiene todo y abre en cualquier máquina. Ideal para archivar una canción terminada. Coste: pesa y puede llenar el autoguardado.\nEN ESTE NAVEGADOR (IndexedDB) — se guarda en la base local del navegador, no dentro del JSON. Proyecto ligero y sin límite práctico. Ideal mientras iteras a diario. Coste: solo existe en este navegador y este dispositivo.\nEXTERNO (solo ficha) — el proyecto guarda nombre, resolución y peso. Lo más ligero y rápido. Coste: al abrirlo en otra máquina hay que re-vincular el archivo con el botón de la tarjeta.'},en:{t:'💾 Where the file lives',b:'INTERNAL — the image or SVG travels inside the project. A single .json contains everything and opens anywhere. Ideal to archive a finished song. Cost: heavy and may fill autosave.\nIN THIS BROWSER (IndexedDB) — stored in the local browser database, not inside the JSON. Light project and no practical limit. Ideal while iterating daily. Cost: exists only in this browser and device.\nEXTERNAL (record only) — the project keeps name, resolution and weight. The lightest and fastest. Cost: on another machine the file must be re-linked with the card button.'}},
bible:{es:{t:'📖 Biblia del director',b:'Son las leyes que la IA obedece por encima de cualquier prompt de clip: canon de personajes, paleta congelada, arquitectura, motivo, continuidad, audio y excepciones narrativas.\n\nSIEMPRE VIAJA: el contrato de director se envía automáticamente como intent.directorContract en Render y Portada, y como directorContract en Guion. No necesitas pulsar nada para que llegue a la IA.\n\nDESTINO: se compila distinto según el receptor (Guion, Video SVG, Portada SVG) pero comparte el mismo canon creativo.\n\nEL BOTÓN "CARGAR CONTRATO": añade una copia del contrato al final de tus notas (intent.bible). Es opcional y sirve si quieres leerlo o editarlo a mano dentro de tus notas; puede duplicar reglas que ya viajan en directorContract.\n\nERROR COMÚN: escribir reglas contradictorias en tus notas y en el Prompt Universal. Usa el detector de conflictos (marca conflictos mecánicos, no tus decisiones de estilo).'},en:{t:'📖 Director bible',b:'These are the laws the AI obeys above any clip prompt: character canon, frozen palette, architecture, motif, continuity, audio and narrative exceptions.\n\nALWAYS TRAVELS: the director contract is sent automatically as intent.directorContract in Render and Cover, and as directorContract in Script. You do not need to press anything for it to reach the AI.\n\nTARGET: it compiles differently per receiver (Script, SVG Video, SVG Cover) but shares the same creative canon.\n\nTHE "LOAD CONTRACT" BUTTON: appends a copy of the contract after your notes (intent.bible). It is optional and useful if you want to read or hand-edit it inside your notes; it may duplicate rules already traveling in directorContract.\n\nCOMMON MISTAKE: writing contradictory rules in your notes and in the Universal Prompt. Use the conflict detector (it flags mechanical conflicts, not your style decisions).'}},
universal:{es:{t:'🎬 Prompt Universal',b:'Es la base que se antepone a CADA prompt de clip: encuadre, cámara, luz, estilo, movimiento y reglas anti-flicker.\nBIBLIOTECA: presets listos para necesidades reales (camuflaje de baja resolución, vertical social, chroma, stop-motion, cel TV, noir, loop sin costura, cuota corta, seguro para subtítulos).\nGUARDAR: escribe el tuyo, ponle título y guárdalo. Se exportan e importan como paquete .json para reutilizarlos en otras canciones.\nERROR COMÚN: pedir aquí cosas que la app ya hace (subtítulos, letterbox, movimiento). Duplicarlas produce doble efecto.'},en:{t:'🎬 Universal Prompt',b:'The base prepended to EVERY clip prompt: framing, camera, light, style, motion and anti-flicker rules.\nLIBRARY: ready presets for real needs (low-resolution camouflage, vertical social, chroma, stop-motion, cel TV, noir, seamless loop, short quota, subtitle-safe).\nSAVE: write yours, give it a title and save it. They export and import as a .json pack to reuse on other songs.\nCOMMON MISTAKE: asking here for things the app already does (subtitles, letterbox, motion). Duplicating them produces a double effect.'}},
lint:{es:{t:'🔍 Conflictos y notas de prompt',b:'La app compara tu Prompt Universal con el destino y separa dos cosas:\n\nCONFLICTOS MECÁNICOS (ámbar, con arreglo en un clic): pedir a la IA que anime (el motor ya anima), hornear letterbox (se aplica en post), dibujar subtítulos o letra (la app los superpone), incrustar recursos externos (el SVG debe ser autocontenido) o pedir desenfoque/motion blur (la app aplica corrección y profundidad por opacidad).\n\nNOTAS (cian, sin arreglo): aspiraciones de estilo como "photoreal". No son un error; a 480px el vector se lee mejor con formas grandes y grano. La app no las marca como conflicto ni te empuja a borrarlas.\n\nTU ESTILO ES SOBERANO: "no cartoon", "photoreal", "painterly" y similares son decisiones tuyas. La app ya no impone un acabado de la casa, así que no los marca como conflicto.\n\nIgnorar un conflicto no bloquea la exportación, pero la IA recibirá instrucciones contradictorias y elegirá por su cuenta.'},en:{t:'🔍 Prompt conflicts and notes',b:'The app compares your Universal Prompt with the target and separates two things:\n\nMECHANICAL CONFLICTS (amber, one-click fix): asking the AI to animate (the engine already animates), baking letterbox (applied in post), drawing subtitles or lyrics (the app overlays them), embedding external resources (the SVG must be self-contained) or asking for blur/motion blur (the app applies correction and depth via opacity).\n\nNOTES (cyan, no fix): style aspirations such as "photoreal". They are not an error; at 480px vector reads better with large shapes and grain. The app does not flag them as conflicts nor push you to remove them.\n\nYOUR STYLE IS SOVEREIGN: "no cartoon", "photoreal", "painterly" and similar are your decisions. The app no longer imposes a house finish, so it does not flag them as conflicts.\n\nIgnoring a conflict does not block export, but the AI will receive contradictory instructions and choose on its own.'}},
knobs:{es:{t:'🎛 Perillas en teléfono',b:'Las perillas ya NO bloquean el scroll: el gesto vertical pasa a la página y solo el horizontal ajusta el valor.\nARRASTRE HORIZONTAL: derecha sube, izquierda baja. La sensibilidad se mide en píxeles por paso, así todas se sienten igual aunque sus rangos sean distintos.\nTOQUE SIMPLE: abre un editor con slider grande, botones −/+ y campo numérico.\nMODO FINO: Shift en escritorio o el interruptor del editor. DOBLE TOQUE: valor por defecto. RUEDA y FLECHAS también funcionan.'},en:{t:'🎛 Knobs on phone',b:'Knobs no longer block scrolling: the vertical gesture goes to the page and only the horizontal gesture adjusts the value.\nHORIZONTAL DRAG: right increases, left decreases. Sensitivity is measured in pixels per step, so every knob feels the same even with different ranges.\nSINGLE TAP: opens an editor with a large slider, −/+ buttons and a numeric field.\nFINE MODE: Shift on desktop or the switch in the editor. DOUBLE TAP: default value. WHEEL and ARROWS also work.'}},
studio:{es:{t:'🎬 Estudio de exportación',b:'MP4 (H.264) se genera con WebCodecs y un multiplexor MP4 escrito dentro de la app: sin librerías, sin descargas, sin servidores. El render es OFFLINE, frame a frame, así que no pierde fotogramas aunque el teléfono vaya lento.\nWEBM es la grabación en tiempo real con audio, la que ya conoces.\nSECUENCIA PNG exporta los fotogramas en ZIP por bloques para no agotar la memoria.\nINFORME DE CAPACIDADES: la app prueba tu navegador antes de ofrecer cada formato. Si MP4 no aparece, tu navegador no puede codificar H.264.\nAUDIO: el MP4 offline es solo video. El audio sigue en el WebM y en tu editor.\nIMPORTAR ≠ EXPORTAR: decodificar H.264 (importar MP4/MOV) y codificarlo (exportar MP4) son capacidades distintas. La app prueba ambas por separado y te muestra el motivo exacto si MP4 no está disponible.\nPNG POR LOTES: elige frames por lote; cada ZIP se descarga directamente sin ventana de confirmación, para que el Estudio no se cierre ni se bloquee. Tu navegador puede pedir permiso para descargar varios archivos.\nVÍDEO IMPORTADO: el render offline busca el fotograma exacto del vídeo antes de dibujar, así que PNG y MP4 también funcionan con vídeo cargado, no solo con SVG.'},en:{t:'🎬 Export studio',b:'MP4 (H.264) is produced with WebCodecs and an MP4 muxer written inside the app: no libraries, no downloads, no servers. Rendering is OFFLINE, frame by frame, so it never drops frames even on a slow phone.\nWEBM is the realtime recording with audio, the one you already know.\nPNG SEQUENCE exports frames into ZIP in chunks so memory is never exhausted.\nCAPABILITY REPORT: the app tests your browser before offering each format. If MP4 is missing, your browser cannot encode H.264.\nAUDIO: the offline MP4 is video only. Audio still lives in the WebM and in your editor.\nIMPORT ≠ EXPORT: decoding H.264 (importing MP4/MOV) and encoding it (exporting MP4) are different capabilities. The app tests both separately and shows the exact reason when MP4 is unavailable.\nBATCHED PNG: pick frames per batch; each ZIP downloads directly with no confirmation dialog so the Studio never closes or locks. Your browser may ask permission to download multiple files.\nIMPORTED VIDEO: offline render seeks the exact video frame before drawing, so PNG and MP4 also work with loaded video, not only SVG.'}},
storage:{es:{t:'💾 Autoguardado y cuota',b:'El autoguardado usa el almacenamiento local del navegador, con un límite de unos 5 MB. Con muchas escenas SVG puede llenarse.\nLa barra de estado muestra el tamaño usado. Si se acerca al límite, la app avisa en vez de fallar en silencio.\nSOLUCIÓN: pasa las escenas pesadas a IndexedDB desde Render SVG, o exporta un respaldo .json completo. El respaldo siempre incluye todo aunque el autoguardado no pueda.'},en:{t:'💾 Autosave and quota',b:'Autosave uses the browser local storage, with a limit of about 5 MB. With many SVG scenes it can fill up.\nThe status bar shows the used size. When it approaches the limit the app warns instead of failing silently.\nFIX: move heavy scenes to IndexedDB from SVG Render, or export a full .json backup. The backup always includes everything even when autosave cannot.'}},
langexport:{es:{t:'🌐 Idioma del JSON',b:'El JSON sale en el idioma activo de la interfaz, para que puedas leerlo y editarlo a mano.\nLa mayoría de las IA siguen instrucciones técnicas con más precisión en inglés. Por eso la app ofrece cambiar a inglés SOLO para ese export, sin tocar el idioma que estás leyendo.\nNunca se exporta mezclado: todos los campos salen en un único idioma.'},en:{t:'🌐 JSON language',b:'The JSON is emitted in the active interface language so you can read and hand-edit it.\nMost AIs follow technical instructions more precisely in English. That is why the app offers switching to English for THAT export only, without changing the language you are reading.\nNever mixed: every field is emitted in a single language.'}},
mediabadge:{es:{t:'📐 Resolución original',b:'La ficha permanente muestra el tamaño real del archivo importado, no el del proyecto.\nVERDE: el origen es igual o mayor que la salida. Sin pérdida.\nÁMBAR: reescalado leve (hasta 1.5×). Aceptable con grano y bokeh.\nROJO: reescalado severo. Se verá blando; baja la resolución del proyecto o consigue un origen mejor.\nEn video también se muestra duración y si el archivo sigue vinculado en esta sesión.'},en:{t:'📐 Original resolution',b:'The permanent record shows the real size of the imported file, not the project size.\nGREEN: source is equal or larger than output. No loss.\nAMBER: mild upscale (up to 1.5×). Acceptable with grain and bokeh.\nRED: severe upscale. It will look soft; lower the project resolution or get a better source.\nFor video it also shows duration and whether the file is still linked in this session.'}},
contracts:{es:{t:'📤 JSON para IA · LEAN y RICH',b:'Un solo compilador produce Guion, Video SVG y Portada SVG, más los esqueletos. Nunca divergen.\n\nGUION (maestro): guarda capa musical, narrativa, clips, estéticas, motivo, planos, refs y canon. No deja escapar nada.\n\nRENDER y PORTADA tienen dos modos (interruptor "Contrato de arte ligero" en Avanzada):\n· LEAN (por defecto): contrato mínimo. Viajan clips con dir, estética y una espina narrativa (section, scene y lines con la letra que cruza el clip), biblia del proyecto, contrato breve de director, prompt universal, estéticas, motivo, refs y safeArea. Menos contexto = más atención al dibujo.\n· RICH: añade story completo (secciones, escenas, asignaciones, letra con energía), canon completo (model sheets) y taxonomía de planos. Úsalo para máxima unificación o trabajo por lotes con canon.\n\nEn ambos modos el contrato de director viaja SIEMPRE como intent.directorContract, separado de tus notas (intent.bible).\n\nQUÉ NO VIAJA: las perillas crudas. La IA recibe cláusulas semánticas (habrá parallax, la app añade partículas y glow, el fondo puede ocultarse) para que no dibuje efectos duplicados.'},en:{t:'📤 AI JSON · LEAN and RICH',b:'A single compiler produces Script, SVG Video and SVG Cover, plus the skeletons. They never diverge.\n\nSCRIPT (master): keeps musical layer, narrative, clips, aesthetics, motif, shots, refs and canon. Nothing escapes.\n\nRENDER and COVER have two modes ("Lean art contract" switch in Advanced):\n· LEAN (default): minimal contract. Clips carry dir, aesthetic and a narrative spine (section, scene and lines with the lyric crossing the clip), project bible, brief director contract, universal prompt, aesthetics, motif, refs and safeArea. Less context = more attention on drawing.\n· RICH: adds full story (sections, scenes, assignments, lyrics with energy), full canon (model sheets) and shot taxonomy. Use it for maximum unification or batch work with canon.\n\nIn both modes the director contract ALWAYS travels as intent.directorContract, separate from your notes (intent.bible).\n\nWHAT DOES NOT TRAVEL: raw knobs. The AI receives semantic clauses (there will be parallax, the app adds particles and glow, the background may be hidden) so it does not draw duplicated effects.'}},
scriptmode:{es:{t:'🧭 Modos de guion',b:'AUTORIZAR — la IA crea escenas, asignaciones y clips desde cero respetando D y la cobertura total. Úsalo cuando aún no has generado clips.\nRELLENAR — tus clips ya existen y viajan BLOQUEADOS en el JSON. La IA solo escribe los prompts, las escenas y las estéticas; no puede tocar ids, tiempos ni frames. Úsalo cuando creaste secciones, generaste clips y luego quieres que la IA los rellene.\nAl importar, la app detecta el modo y te ofrece conservar tus clips o aceptar los de la IA, con vista previa.'},en:{t:'🧭 Script modes',b:'AUTHOR — the AI creates scenes, assignments and clips from scratch respecting D and full coverage. Use it when you have not generated clips yet.\nFILL — your clips already exist and travel LOCKED in the JSON. The AI only writes prompts, scenes and aesthetics; it cannot touch ids, times or frames. Use it when you created sections, generated clips and then want the AI to fill them.\nOn import the app detects the mode and offers to keep your clips or accept the AI ones, with a preview.'}},
csvclock:{es:{t:'🥁 CSV de beats como reloj',b:'El CSV de Sonic Visualiser puede gobernar el reloj igual que el BPM, con rejilla irregular que sigue el tempo real de la grabación.\nCONTENIDO: indica si cada fila es un BEAT o un COMPÁS. El export "Bar and Beat Tracker: Bars" produce COMPASES.\nSPAN: cuántos compases representa cada fila. En AUTO se deduce comparando la mediana del CSV con el compás del BPM. Ejemplo real: a 170 BPM un compás 4/4 dura 1.412 s, pero Sonic Visualiser entregó filas cada 2.821 s → span 2.\nOFFSET PROPIO: el CSV tiene su propio offset, independiente del offset del BPM, para corregir el pequeño error de detección sin tocar lo que ya ajustaste.\nJERARQUÍA: por defecto manda el BPM si ambos están cargados y el CSV queda como contexto visual. Puedes invertir la prioridad.'},en:{t:'🥁 Beat CSV as clock',b:'The Sonic Visualiser CSV can drive the clock just like BPM, with an irregular grid that follows the real tempo of the recording.\nCONTENT: state whether each row is a BEAT or a BAR. The "Bar and Beat Tracker: Bars" export produces BARS.\nSPAN: how many bars each row represents. In AUTO it is deduced by comparing the CSV median with the BPM bar. Real example: at 170 BPM a 4/4 bar lasts 1.412 s, but Sonic Visualiser delivered rows every 2.821 s → span 2.\nOWN OFFSET: the CSV has its own offset, independent from the BPM offset, to correct the small detection error without touching what you already tuned.\nPRIORITY: by default BPM wins when both are loaded and the CSV stays as visual context. You can invert the priority.'}},
motion:{es:{t:'🎛 Motor de movimiento',b:'La IA entrega arte ESTÁTICO por capas; la app aplica toda la animación.\nMotion ON/OFF congela capas, partículas y pulso. Intensidad = pulso al reloj · Glow = brillo · Partículas = cantidad, tamaño y variación · Velocidad = deriva · Matiz = rota la paleta.\nCinco capas en orden Z: fondo, lejano, medio, sujeto, luz. Cada una lleva data-depth (parallax), data-motion (comportamiento) y data-anchor (pivote).\nERROR COMÚN: pedir desenfoque o partículas a la IA. La app ya los añade y se verían dobles.'},en:{t:'🎛 Motion engine',b:'The AI delivers STATIC layered art; the app applies all animation.\nMotion ON/OFF freezes layers, particles and pulse. Intensity = clock pulse · Glow = brightness · Particles = count, size and variation · Speed = drift · Hue = palette rotation.\nFive layers in Z order: fondo, lejano, medio, sujeto, luz. Each carries data-depth (parallax), data-motion (behavior) and data-anchor (pivot).\nCOMMON MISTAKE: asking the AI for blur or particles. The app already adds them and they would double.'}},
safearea:{es:{t:'💬 Área segura de subtítulos',b:'Es la banda donde la app escribirá la letra. Se calcula sola desde la posición, margen y tamaño del texto.\nEl arte debe dejar esa zona limpia: sin rostros, sin detalle focal, sin bordes de alto contraste. Diferencia de valor por debajo del 12%.\nEl foco va en el 55% superior del encuadre. Dobladillos y multitudes pueden cruzar la banda solo como masas planas y apagadas.'},en:{t:'💬 Subtitle safe area',b:'The band where the app will write the lyrics. It is computed automatically from text position, margin and size.\nThe art must keep that zone clean: no faces, no focal detail, no high-contrast edges. Value delta under 12 percent.\nThe focal point goes in the upper 55 percent of the frame. Hems and crowds may cross the band only as flat muted masses.'}},
chroma:{es:{t:'🎨 Chroma y transparencia',b:'Transparente funciona en la vista previa y en PNG. En video no es fiable: usa chroma verde o azul y haz keying en tu editor.\nIMPORTANTE: activa "Ocultar capa de fondo del SVG". Sin eso, la capa fondo del arte taparía el chroma y el recorte sería imposible.\nPor eso el contrato exige que el sujeto se lea bien sobre fondo plano: lleva su propio halo, su luz de borde y su sombra de contacto.'},en:{t:'🎨 Chroma and transparency',b:'Transparent works in preview and PNG. On video it is not reliable: use green or blue chroma and key it in your editor.\nIMPORTANT: enable "Hide SVG background layer". Without it the art background layer would cover the chroma and keying would be impossible.\nThat is why the contract requires the subject to read well over a flat background: it carries its own halo, rim light and contact shadow.'}},
cover:{es:{t:'🖼 Portada · key art de cine',b:'No es una captura del video: es el cartel de la película. Un solo frame pintado que promete la historia.\nTres niveles de lectura: héroe dominante (55-70%), reparto o entidad (20-30%), mundo y atmósfera (10-20%).\nDebe leerse a 200 px de ancho y a dos metros. Si la silueta no se entiende al entrecerrar los ojos, hay que recomponer.\nSi el video es vertical y la portada horizontal, se RE-ESCENIFICA: nunca se recorta ni se estira.'},en:{t:'🖼 Cover · theatrical key art',b:'It is not a screenshot of the video: it is the movie poster. A single painted frame that promises the story.\nThree read tiers: dominant hero (55-70%), cast or entity (20-30%), world and atmosphere (10-20%).\nIt must read at 200 px wide and at two meters. If the silhouette fails the squint test, recompose.\nIf the video is vertical and the cover horizontal, the scene is RE-STAGED: never cropped or stretched.'}},
title:{es:{t:'🎛 Texto v2',b:'Módulo compartido por Portadas (título) y Render (subtítulos). Una única función de layout alimenta canvas y SVG: la paridad es exacta entre preview, PNG y SVG.\nALCANCE: SRT y VTT exportan solo texto y tiempos, sin estilo. ASS es una aproximacion: fuente, color y caja no replican Texto v2. Si necesitas el aspecto exacto, quema los subtítulos en el vídeo desde el Estudio.\nRelleno, contorno, sombra doble y caja pill estilo TikTok/Reels. Presets de un toque.\nLa IA nunca dibuja texto: solo reserva el hueco. Así el título es editable, nítido y en tu idioma sin volver a generar el arte.'},en:{t:'🎛 Text v2',b:'Module shared by Covers (title) and Render (subtitles). One layout function feeds canvas and SVG: parity is exact across preview, PNG and SVG.\nSCOPE: SRT and VTT export text and timing only, with no styling. ASS is an approximation: font, color and box do not replicate Text v2. If you need the exact look, burn the subtitles into the video from the Studio.\nFill, outline, double shadow and TikTok/Reels pill box. One-tap presets.\nThe AI never draws text: it only reserves the space. The title stays editable, crisp and in your language without regenerating the art.'}},
resolution:{es:{t:'📐 Resolución del proyecto',b:'Define el lienzo real, el tamaño del video exportado y el viewBox que la IA debe respetar.\nVERTICAL 9:16 para redes · 1:1 para feed · 16:9 para YouTube · formatos de cine para look anamórfico.\n4K exige mucha máquina: si va pesado, baja la escala del Estudio de exportación antes que la resolución del proyecto, porque la resolución viaja en el contrato y la IA compone para ella.'},en:{t:'📐 Project resolution',b:'Defines the real canvas, the exported video size and the viewBox the AI must honor.\nVERTICAL 9:16 for social · 1:1 for feed · 16:9 for YouTube · cinema formats for an anamorphic look.\n4K demands a lot of machine: if it is heavy, lower the Export Studio scale before project resolution, because resolution travels in the contract and the AI composes for it.'}},
dclip:{es:{t:'⏱ D, Core y Gen',b:'D es el techo duro de duración de un clip. Sirve para que la IA de video no reciba clips más largos de lo que puede generar.\nGEN es el tramo total que se envía a generar. CORE es Gen menos el solapamiento S repartido en los dos extremos: es la parte que realmente se ve en el montaje.\nFRAMES se calcula siempre como round(duración / 1000 × fps).\nSi un clip supera D se marca rojo en el Timeline y puedes partirlo en frontera musical.'},en:{t:'⏱ D, Core and Gen',b:'D is the hard ceiling of a clip duration. It keeps the video AI from receiving clips longer than it can generate.\nGEN is the full span sent to generate. CORE is Gen minus the overlap S split across both ends: it is the part actually seen in the edit.\nFRAMES is always round(duration / 1000 × fps).\nIf a clip exceeds D it turns red on the Timeline and you can split it on a musical boundary.'}},
flf:{es:{t:'🔗 First-Last-Frame',b:'Cuando dos clips vecinos comparten escena, el último fotograma del primero puede usarse como primer fotograma del segundo. Eso da continuidad visual real entre generaciones.\nSe activa por defecto global, por escena, o con continuidad cruzada entre asignaciones de la misma escena.\nLa app recalcula los enlaces sola cada vez que mueves, partes o reordenas clips.'},en:{t:'🔗 First-Last-Frame',b:'When two neighbouring clips share a scene, the last frame of the first can be used as the first frame of the second. That gives real visual continuity between generations.\nIt is enabled globally, per scene, or with cross-continuity between assignments of the same scene.\nThe app recomputes the links automatically whenever you move, split or reorder clips.'}},
shortcuts:{es:{t:'⌨ Atajos de teclado',b:'Funcionan en escritorio cuando no estás escribiendo en un campo ni hay una ventana abierta. Se pueden desactivar en Configuración avanzada.\nL M S C · marcar línea, sección, escena, clip\nSpace · play/pause · R · ciclo de loop (off·2·4·8·clip·todo)\n, . · clip anterior/siguiente · Shift+, Shift+. · sección\n← → · ±1 s · Shift · ±1 frame · Alt · ±1 beat\n+ − · zoom · 0 · zoom completo\nB · partir clip · Alt+↑↓ · reordenar · Alt+S · centinela\nShift+↑↓ · motivo · Q W · escala de plano\nV · fila de planos · N · fila de motivo · G · guías\nE · estudio de exportación · I · importar · Ctrl+S · guardar\nH o ? · ayuda de la pestaña · Ctrl+Z / Ctrl+Y · deshacer/rehacer\n/ o Ctrl+K · buscar en fichas, glosario y recetas\nL M S C solo actúan estando en la pestaña Timeline'},en:{t:'⌨ Keyboard shortcuts',b:'They work on desktop when you are not typing in a field and no window is open. They can be disabled in Advanced settings.\nL M S C · mark line, section, scene, clip\nSpace · play/pause · R · loop cycle (off·2·4·8·clip·all)\n, . · previous/next clip · Shift+, Shift+. · section\n← → · ±1 s · Shift · ±1 frame · Alt · ±1 beat\n+ − · zoom · 0 · full zoom\nB · split clip · Alt+↑↓ · reorder · Alt+S · sentinel\nShift+↑↓ · motif · Q W · shot scale\nV · shots lane · N · motif lane · G · guides\nE · export studio · I · import · Ctrl+S · save\nH or ? · tab help · Ctrl+Z / Ctrl+Y · undo/redo\n/ or Ctrl+K · search cards, glossary and recipes\nL M S C only act while you are on the Timeline tab'}},
base:{es:{t:'🧩 Escena base',b:'Genera una escena SVG de prueba por clip con las cinco capas etiquetadas (fondo, lejano, medio, sujeto, luz).\nSirve para probar el motor, el chroma y la exportación antes de pedir arte a la IA.\n⚠ Sobrescribe las escenas existentes. Ctrl+Z revierte.'},en:{t:'🧩 Base scene',b:'Generates a test SVG scene per clip with the five tagged layers (fondo, lejano, medio, sujeto, luz).\nUse it to test the engine, chroma and export before asking the AI for art.\n⚠ Overwrites existing scenes. Ctrl+Z undoes.'}},
import:{es:{t:'📥 Importación inteligente',b:'Reconoce el tipo por contenido, no por extensión: proyecto, solicitud, guion, portadas, escenas SVG, referencias, paquetes de presets, letra, SRT y estéticas.\nTOLERANCIA: acepta bloques de código, conversación alrededor del JSON y claves con espacios sobrantes de herramientas externas.\nVISTA PREVIA: siempre muestra qué va a entrar y qué se reemplaza antes de aplicar. Ctrl+Z revierte.'},en:{t:'📥 Smart import',b:'Recognizes the type by content, not by extension: project, request, script, covers, SVG scenes, references, preset packs, lyrics, SRT and aesthetics.\nTOLERANCE: accepts code blocks, conversation around the JSON and keys with trailing spaces from external tools.\nPREVIEW: it always shows what will come in and what gets replaced before applying. Ctrl+Z undoes.'}},
guide:{es:{t:'🧭 Ruta guiada',b:'La app mira el estado real de tu proyecto y te dice cuál es el siguiente paso útil, no una lista genérica.\n\nORDEN: reloj → duración → secciones → letra → clips → prompts → arte → revisión → exportación.\n\nCada aviso del sistema lleva un botón "Ir al control" que salta a la pestaña exacta y resalta el campo que lo resuelve. No tienes que recordar dónde estaba.\n\nERROR COMÚN: intentar exportar arte antes de tener prompts. La ruta te lo señala en el paso 5.'},en:{t:'🧭 Guided route',b:'The app reads the real state of your project and tells you the next useful step, not a generic list.\n\nORDER: clock → duration → sections → lyrics → clips → prompts → art → review → export.\n\nEvery system warning carries a "Go to control" button that jumps to the exact tab and highlights the field that fixes it. You do not have to remember where it was.\n\nCOMMON MISTAKE: trying to export art before having prompts. The route flags it at step 5.'}}
,
home:{es:{t:'🏠 Inicio · tu punto de partida',b:'QUÉ ES: el panel que lee el estado real de tu proyecto y te dice el siguiente paso útil, no una lista genérica.\n\nCÓMO SE CONECTA: la ruta guiada de 8 pasos mira reloj, duración, secciones, letra, clips, prompts, arte y revisión. Cada paso tiene un botón que salta a la pestaña exacta y resalta el control que lo resuelve.\n\nCONTROLES: Empezar te lleva a Config. Glosario abre los términos del estudio con salto a su pestaña. Recetas son flujos paso a paso que cruzan varias pestañas. La lupa de la cabecera busca en fichas, glosario y recetas.\n\nERROR COMÚN: exportar arte antes de tener prompts de clip. La ruta lo señala en el paso 5; si lo saltas, la IA recibe clips sin dirección visual.'},en:{t:'🏠 Home · your starting point',b:'WHAT IT IS: the panel that reads the real state of your project and tells you the next useful step, not a generic list.\n\nHOW IT CONNECTS: the 8-step guided route looks at clock, duration, sections, lyrics, clips, prompts, art and review. Every step has a button that jumps to the exact tab and highlights the control that fixes it.\n\nCONTROLS: Start takes you to Settings. Glossary opens the studio terms with a jump to their tab. Recipes are step-by-step flows across several tabs. The magnifier in the header searches cards, glossary and recipes.\n\nCOMMON MISTAKE: exporting art before having clip prompts. The route flags it at step 5; if you skip it, the AI receives clips without visual direction.'}},
sections:{es:{t:'📑 Secciones · la arquitectura de la canción',b:'QUÉ ES: los tramos grandes de la canción (Intro, Estrofa, Coro, Puente, Outro) con su tiempo, descripción, intérprete y estética propia.\n\nCÓMO SE CONECTA: las secciones son la capa musical, inmutable para la IA. Sobre ellas se montan las asignaciones de escena, los clips y las líneas de letra. La cobertura que ves en la barra de estado se calcula con los tramos de sección.\n\nCONTROLES: Añadir sección por tiempo o por rejilla musical; marcar inicio y fin con M en el Timeline; Ordenar por tiempo reordena cronológicamente con remapeo seguro de asignaciones y clips. Las flechas solo reordenan la lista: los tiempos no se tocan.\n\nERROR COMÚN: borrar una sección arrastra sus líneas, clips y asignaciones. Revisa el aviso antes de confirmar; Ctrl+Z revierte.'},en:{t:'📑 Sections · the architecture of the song',b:'WHAT IT IS: the large spans of the song (Intro, Verse, Chorus, Bridge, Outro) with their time, description, interpreter and own aesthetic.\n\nHOW IT CONNECTS: sections are the musical layer, immutable for the AI. Scene assignments, clips and lyric lines mount on them. The coverage shown in the status bar is computed from section spans.\n\nCONTROLS: Add section by time or by musical grid; mark start and end with M on the Timeline; Sort by time reorders chronologically with safe remapping of assignments and clips. The arrows only reorder the list: times are not touched.\n\nCOMMON MISTAKE: deleting a section pulls its lines, clips and assignments. Review the warning before confirming; Ctrl+Z undoes.'}},
lyrics:{es:{t:'✍️ Letra · timing y subtítulos',b:'QUÉ ES: cada verso con su tiempo exacto, intérprete y energía E0-E3.\n\nCÓMO SE CONECTA: la letra es lo único que la app escribe sobre el vídeo. Viaja a los prompts como espina narrativa y al render como subtítulos. La IA nunca dibuja texto: solo reserva safeArea.\n\nCONTROLES: plantilla .txt, importar, pegar, SRT sin música, o crear línea a línea. Compases por línea fija la duración por defecto. Marcar con L en el Timeline. Auto energía propone E0-E3 según el texto. El retardo en milisegundos se ajusta en Render.\n\nERROR COMÚN: dejar una línea fuera de los límites de su sección; la validación lo avisa con salto al control. Otra trampa: importar SRT y luego definir BPM esperando que se recologue; el SRT conserva sus tiempos exactos.'},en:{t:'✍️ Lyrics · timing and subtitles',b:'WHAT IT IS: each verse with its exact time, interpreter and energy E0-E3.\n\nHOW IT CONNECTS: lyrics are the only thing the app writes over the video. They travel to prompts as the narrative spine and to the render as subtitles. The AI never draws text: it only reserves safeArea.\n\nCONTROLS: .txt template, import, paste, SRT without music, or create line by line. Bars per line sets the default duration. Mark with L on the Timeline. Auto energy proposes E0-E3 from the text. The delay in milliseconds is adjusted in Render.\n\nCOMMON MISTAKE: leaving a line outside the bounds of its section; validation warns with a jump to the control. Another trap: importing SRT and then setting BPM expecting a re-flow; SRT keeps its exact times.'}},
scenes:{es:{t:'🎬 Escenas · dirección visual reutilizable',b:'QUÉ ES: la biblioteca de mundos visuales. Cada escena tiene nombre, dirección visual, estética y ajustes propios de duración, solapamiento y First-Last-Frame.\n\nCÓMO SE CONECTA: una escena no hace nada hasta que la ASIGNAS a un tramo de una sección. Los clips de ese tramo heredan su escena, y de ahí sale la dirección que recibe la IA. Los clips vecinos que comparten escena pueden encadenar el último fotograma con el primero del siguiente.\n\nCONTROLES: Crear escena, Asignar a sección por tramo, editar sus ajustes propios. Las asignaciones están plegadas por defecto para no saturar la vista.\n\nERROR COMÚN: crear una escena y no asignarla; los clips no la heredan y la IA recibe un plano sin mundo. Otro: confundir escena con escena SVG; la primera es dirección narrativa, la segunda es el arte que devuelve la IA.'},en:{t:'🎬 Scenes · reusable visual direction',b:'WHAT IT IS: the library of visual worlds. Each scene has a name, visual direction, aesthetic and its own settings for duration, overlap and First-Last-Frame.\n\nHOW IT CONNECTS: a scene does nothing until you ASSIGN it to a span of a section. Clips in that span inherit its scene, and that is where the direction the AI receives comes from. Neighbouring clips sharing a scene can chain the last frame into the first of the next.\n\nCONTROLS: Create scene, Assign to section by span, edit its own settings. Assignments are collapsed by default to keep the view clean.\n\nCOMMON MISTAKE: creating a scene and not assigning it; clips do not inherit it and the AI receives a shot without a world. Another: confusing scene with SVG scene; the first is narrative direction, the second is the art the AI returns.'}},
export:{es:{t:'📤 Exportar · salida y verificación',b:'QUÉ ES: el punto donde tu proyecto sale hacia el mundo y donde compruebas que está sano antes de salir.\n\nCÓMO SE CONECTA: la importación inteligente reconoce el tipo por contenido, no por extensión, y siempre muestra vista previa. La validación avisa con destino: cada aviso lleva un botón que salta al control que lo resuelve. El Self-Test verifica los motores internos.\n\nCONTROLES: Proyecto .json es el respaldo total. Estudio de video exporta MP4 offline, WebM con audio o PNG por lotes. Informe .txt es la lectura humana. Guion para IA, Referencias, Prompt Universal, Subtítulos, Marcadores, Fotograma PNG y Manual completan la lista. Los registros de uso y de lote son opcionales y viven fuera del proyecto.\n\nERROR COMÚN: exportar sin reloj o sin prompts; la validación y la ruta guiada lo señalan antes. Otro: olvidar el respaldo .json al terminar cada sesión de trabajo.'},en:{t:'📤 Export · output and verification',b:'WHAT IT IS: the place where your project goes out into the world and where you check it is healthy before it leaves.\n\nHOW IT CONNECTS: smart import recognizes the type by content, not by extension, and always shows a preview. Validation warns with a destination: every warning has a button that jumps to the control that fixes it. The Self-Test verifies the internal engines.\n\nCONTROLS: Project .json is the full backup. Video studio exports offline MP4, WebM with audio or batched PNG. Report .txt is the human reading. AI Script, References, Universal Prompt, Subtitles, Markers, PNG frame and Manual complete the list. The usage and batch ledgers are optional and live outside the project.\n\nCOMMON MISTAKE: exporting without a clock or without prompts; validation and the guided route flag it first. Another: forgetting the .json backup at the end of each work session.'}},
ledger:{es:{t:'📒 Registros locales · uso y lote',b:'QUÉ ES: dos registros opcionales, apagados por defecto, que viven solo en este navegador y en claves separadas del proyecto. No se suben a ningún sitio y no contienen contenido de tu obra.\n\nREGISTRO DE USO: cuenta pestañas visitadas, acciones, fichas de ayuda abiertas, avisos por tipo, exports por formato e imports confirmados o fallidos. Sirve para saber cómo trabajas y dónde se atasca el flujo.\n\nREGISTRO DE LOTE: vincula cada exportación con su importación posterior. Guarda modo LEAN o RICH, número de clips, marca de centinela, el modelo que etiquetas a mano, el tiempo de retorno, las escenas válidas sobre el total y los avisos del blindaje agregados. En Guion las escenas son narrativas y el contador de blindaje es 0 porque el blindaje de SVG no aplica a un guion.\n\nCÓMO SE CONECTA: el respaldo del proyecto no incluye ninguno de los dos. Purgar borra solo su clave; tu obra no se toca. Al desactivar se purga, por privacidad.\n\nERROR COMÚN: interpretar el 0 de blindaje en un lote de Guion como auditado y limpio. Ese 0 significa no aplicable.'},en:{t:'📒 Local ledgers · usage and batch',b:'WHAT IT IS: two optional ledgers, off by default, living only in this browser under keys separate from the project. They are never uploaded anywhere and contain no content of your work.\n\nUSAGE LEDGER: counts tabs visited, actions, help cards opened, warnings by type, exports by format and confirmed or failed imports. It tells you how you work and where the flow gets stuck.\n\nBATCH LEDGER: links each export with its later import. It stores LEAN or RICH mode, clip count, sentinel flag, the model you tag by hand, the return time, valid scenes over total and aggregated armor warnings. In Script the scenes are narrative and the armor counter is 0 because the SVG armor does not apply to a script.\n\nHOW IT CONNECTS: the project backup includes neither of them. Purging deletes only its own key; your work is untouched. Disabling purges, for privacy.\n\nCOMMON MISTAKE: reading the 0 armor count in a Script batch as audited and clean. That 0 means not applicable.'}}
};
var TAB_HELP={home:'home',config:'csvclock',timeline:'timeline',sections:'sections',lyrics:'lyrics',scenes:'scenes',clips:'clips',refs:'refs',creative:'bible',covers:'cover',render:'motion',export:'export'};
var GLOSSARY=[
{k:'D',tab:'config',help:'dclip',es:{t:'D · techo de duración',d:'Techo duro de duración de un clip (Duración objetivo en Config). Ningún clip debe superarlo: si lo supera se marca rojo en el Timeline y puedes partirlo en frontera musical. La IA de vídeo no recibe clips más largos de lo que puede generar.'},en:{t:'D · duration ceiling',d:'Hard ceiling of a clip duration (Target duration in Settings). No clip should exceed it: over-D clips turn red on the Timeline and can be split on a musical boundary. The video AI never receives clips longer than it can generate.'}},
{k:'Gen',tab:'clips',help:'dclip',es:{t:'Gen · tramo enviado a generar',d:'Tramo total que se envía a generar (genStartMs → genEndMs). Incluye el solapamiento S en ambos extremos.'},en:{t:'Gen · span sent to generate',d:'Full span sent to generate (genStartMs → genEndMs). It includes the overlap S at both ends.'}},
{k:'Core',tab:'clips',help:'dclip',es:{t:'Core · lo que se ve',d:'Gen menos el solapamiento S repartido en los dos extremos: la parte del clip que realmente se ve en el montaje.'},en:{t:'Core · what is seen',d:'Gen minus the overlap S split across both ends: the part of the clip actually seen in the edit.'}},
{k:'S',tab:'config',help:'dclip',es:{t:'S · solapamiento',d:'Solapamiento en segundos entre clips vecinos, repartido mitad al inicio y mitad al final. Da margen para transiciones sin perder cobertura.'},en:{t:'S · overlap',d:'Overlap in seconds between neighbouring clips, split half at the start and half at the end. It gives room for transitions without losing coverage.'}},
{k:'FLF',tab:'scenes',help:'flf',es:{t:'FLF · First-Last-Frame',d:'El último fotograma de un clip se usa como primero del siguiente cuando comparten escena, para continuidad visual real entre generaciones. Se activa global, por escena o con continuidad cruzada.'},en:{t:'FLF · First-Last-Frame',d:'The last frame of a clip is used as the first of the next when they share a scene, for real visual continuity between generations. Enabled globally, per scene or with cross-continuity.'}},
{k:'frames',tab:'clips',help:'dclip',es:{t:'frames · fotogramas',d:'Número de fotogramas del clip: round(duración / 1000 × fps). Viaja en cada contrato para que la IA sepa cuánto debe durar.'},en:{t:'frames · frame count',d:'Frame count of the clip: round(duration / 1000 × fps). It travels in every contract so the AI knows how long it must last.'}},
{k:'reloj',tab:'config',help:'csvclock',es:{t:'reloj · la fuente del tiempo',d:'BPM (rejilla uniforme) o CSV de beats (rejilla irregular que sigue la grabación). El vídeo importado también puede ser el reloj maestro. Sin reloj no hay compases ni snap musical.'},en:{t:'clock · the time source',d:'BPM (uniform grid) or beat CSV (irregular grid following the recording). Imported video can also be the master clock. Without a clock there are no bars or musical snap.'}},
{k:'compás',tab:'config',help:'csvclock',es:{t:'compás · agrupación de pulsos',d:'Agrupación de pulsos definida en Config (por ejemplo 4/4). Determina la duración del compás musical, los loops por compases y las líneas por compás.'},en:{t:'bar · beat grouping',d:'Grouping of beats defined in Settings (for example 4/4). It determines the musical bar length, bar-based loops and bars-per-line.'}},
{k:'span',tab:'config',help:'csvclock',es:{t:'span · compases por fila del CSV',d:'Cuántos compases representa cada fila del CSV. En AUTO se deduce comparando la mediana del CSV con el compás del BPM.'},en:{t:'span · bars per CSV row',d:'How many bars each CSV row represents. In AUTO it is deduced by comparing the CSV median with the BPM bar.'}},
{k:'offset',tab:'config',help:'csvclock',es:{t:'offset · alineación en ms',d:'Desplazamiento en milisegundos para alinear la rejilla con la grabación. El BPM y el CSV tienen offsets independientes.'},en:{t:'offset · ms alignment',d:'Shift in milliseconds to align the grid with the recording. BPM and CSV have independent offsets.'}},
{k:'safeArea',tab:'render',help:'safearea',es:{t:'safeArea · banda de subtítulos',d:'Banda reservada para los subtítulos, calculada desde la posición y el tamaño del texto. El arte debe dejarla limpia y de bajo contraste; la IA nunca dibuja texto.'},en:{t:'safeArea · subtitle band',d:'Band reserved for subtitles, computed from text position and size. The art must keep it clean and low-contrast; the AI never draws text.'}},
{k:'depth',tab:'render',help:'motion',es:{t:'depth · data-depth',d:'Atributo data-depth (0..1) de cada capa SVG: cuánto se mueve con el parallax. 0 = fondo casi fijo, 1 = primer plano con más deriva.'},en:{t:'depth · data-depth',d:'data-depth attribute (0..1) of each SVG layer: how much it moves with parallax. 0 = nearly fixed background, 1 = foreground with more drift.'}},
{k:'anchor',tab:'render',help:'motion',es:{t:'anchor · data-anchor',d:'Atributo data-anchor (x,y en 0..1) de cada capa: el pivote alrededor del cual la capa escala y rota.'},en:{t:'anchor · data-anchor',d:'data-anchor attribute (x,y in 0..1) of each layer: the pivot around which the layer scales and rotates.'}},
{k:'motion',tab:'render',help:'motion',es:{t:'motion · data-motion',d:'Atributo data-motion de cada capa (float, drift, pulse, breathe, rise, spin, kenburns): el comportamiento que aplica el motor. La IA entrega SVG estático; el motor es dueño de la animación.'},en:{t:'motion · data-motion',d:'data-motion attribute of each layer (float, drift, pulse, breathe, rise, spin, kenburns): the behavior the engine applies. The AI delivers static SVG; the engine owns animation.'}},
{k:'LUT',tab:'creative',help:'bible',es:{t:'LUT · look de color de la pieza',d:'Estilo de gradación compartido entre clips y portada para que todo parezca la misma película. Los colores locales de personaje quedan congelados; solo cambia la luz.'},en:{t:'LUT · show color look',d:'Grading style shared across clips and cover so everything feels like the same film. Character local colors stay frozen; only light changes.'}},
{k:'canon',tab:'creative',help:'contracts',es:{t:'canon · model sheets',d:'Model sheets reutilizables (canon.characters/sets/motifs): cada personaje es una anatomía continua que se repite byte-idéntica entre clips, con paleta congelada. Lo devuelve la IA de guion y viaja a Render y Portada en RICH.'},en:{t:'canon · model sheets',d:'Reusable model sheets (canon.characters/sets/motifs): each character is one continuous anatomy repeated byte-identical across clips, with frozen palette. The script AI returns it and it travels to Render and Cover in RICH.'}},
{k:'centinela',tab:'clips',help:'sentinels',es:{t:'centinela · clip de prueba ★',d:'Marca ★ sobre 3 clips de prueba (héroe+set, entidad+caos, clímax). Exportas solo esos; si pasan tu revisión, el lote completo saldrá coherente. No son clips nuevos.'},en:{t:'sentinel · test clip ★',d:'★ flag on 3 test clips (hero+set, entity+chaos, climax). You export only those; if they pass your review, the full batch will be coherent. They are not new clips.'}},
{k:'motivo',tab:'timeline',help:'motif',es:{t:'motivo · símbolo recurrente',d:'Símbolo recurrente de la historia, mapeado en el Timeline con los códigos fijos M0–M11 (color e icono constantes; significado personalizable por proyecto).'},en:{t:'motif · recurring symbol',d:'Recurring symbol of the story, mapped on the Timeline with fixed codes M0–M11 (constant color and glyph; per-project customizable meaning).'}},
{k:'plano',tab:'timeline',help:'shots',es:{t:'plano · clasificación de cámara',d:'Clasificación cinematográfica por clip con vocabulario cerrado: escala, angulación, punto de vista, sujetos, movimiento y función (SIZE/ANGLE/POV/CAST/MOVE/FUNC). Ejemplo: PM / ESC / FIJ.'},en:{t:'shot · camera classification',d:'Per-clip cinematic classification with closed vocabulary: scale, angle, point of view, subjects, movement and function (SIZE/ANGLE/POV/CAST/MOVE/FUNC). Example: PM / ESC / FIJ.'}},
{k:'LEAN',tab:'export',help:'contracts',es:{t:'LEAN · contrato de arte ligero',d:'Modo por defecto: clips con dir, estética y espina narrativa (section, scene, lines), biblia, contrato breve, prompt universal, refs y safeArea. Menos contexto = más atención al dibujo.'},en:{t:'LEAN · lean art contract',d:'Default mode: clips with dir, aesthetic and narrative spine (section, scene, lines), bible, brief contract, universal prompt, refs and safeArea. Less context = more attention on drawing.'}},
{k:'RICH',tab:'export',help:'contracts',es:{t:'RICH · contrato completo',d:'Añade story (secciones, escenas, asignaciones, letra con energía), canon completo y taxonomía de planos. Para máxima unificación o lotes con canon.'},en:{t:'RICH · full contract',d:'Adds story (sections, scenes, assignments, lyrics with energy), full canon and shot taxonomy. For maximum unification or batches with canon.'}},
{k:'blindaje',tab:'render',help:'',es:{t:'blindaje · Armor nivel 2',d:'Auditoría mecánica de solo lectura y no bloqueante. Verifica capas, tags, texto, scripts, viewBox, halos y suelo duro al exportar e importar. Avisa, jamás rechaza ni modifica.'},en:{t:'armor · level 2 audit',d:'Read-only, non-blocking mechanical audit. Checks layers, tags, text, scripts, viewBox, halos and hard ground on export and import. It warns, never rejects or modifies.'}},
{k:'IndexedDB',tab:'refs',help:'refstore',es:{t:'IndexedDB · base local del navegador',d:'Modo de almacenamiento para escenas, portadas y referencias: proyecto ligero sin límite práctico, pero solo existe en este navegador y dispositivo.'},en:{t:'IndexedDB · local browser database',d:'Storage mode for scenes, covers and references: light project with no practical limit, but it exists only in this browser and device.'}},
{k:'chroma',tab:'render',help:'chroma',es:{t:'chroma · fondo para keying',d:'Fondo verde o azul plano para recortar en tu editor. Actívalo en Render y marca «Ocultar capa de fondo del SVG» para que el fondo del arte no tape el chroma.'},en:{t:'chroma · keying background',d:'Flat green or blue background for keying in your editor. Enable it in Render and check "Hide SVG background layer" so the art background does not cover the chroma.'}}
,
{k:'ledger',tab:'export',help:'ledger',es:{t:'ledger · registro local opcional',d:'Registro opcional y apagado por defecto que vive en una clave separada del proyecto. El de uso cuenta pestañas, acciones, ayuda, avisos, exports e imports; el de lote vincula export con import. Ninguno contiene contenido de la obra y purgar no la toca.'},en:{t:'ledger · opt-in local record',d:'Optional record, off by default, living under a key separate from the project. The usage one counts tabs, actions, help, warnings, exports and imports; the batch one links export with import. Neither contains work content and purging does not touch it.'}},
{k:'lote',tab:'export',help:'ledger',es:{t:'lote · tanda de clips enviada a la IA',d:'Conjunto de clips exportado de una vez para generar. El registro de lote lo vincula con su importación posterior y mide tiempo de retorno, escenas válidas sobre total y avisos del blindaje. Los centinelas son un lote pequeño de calibración antes del lote completo.'},en:{t:'batch · set of clips sent to the AI',d:'Set of clips exported at once for generation. The batch ledger links it with its later import and measures return time, valid scenes over total and armor warnings. Sentinels are a small calibration batch before the full batch.'}}
];
function glossaryById(k){for(var i=0;i<GLOSSARY.length;i++)if(GLOSSARY[i].k===k)return GLOSSARY[i];return null;}
function tabName(k){var n=k;tabDefs().forEach(function(d){if(d[0]===k)n=d[1];});return n;}
function glossaryHTML(term){
var g=term?glossaryById(term):null;
if(g){
var x=g[CFG.lang]||g.en;

var _searchIdx=null,_searchSig='',_searchTimer=null;
function searchIndex(){
var sig=CFG.lang+'|'+(typeof RECETAS!=='undefined'?RECETAS.length:0);
if(_searchIdx&&_searchSig===sig)return _searchIdx;
var ix=[];
for(var k in HELP){var x=HELP[k][CFG.lang]||HELP[k].en;ix.push({kind:'help',k:k,tab:'',t:x.t,b:x.b});}
GLOSSARY.forEach(function(g){var y=g[CFG.lang]||g.en;ix.push({kind:'gloss',k:g.k,tab:g.tab,t:y.t,b:y.d});});
if(typeof RECETAS!=='undefined')RECETAS.forEach(function(r){var y=r[CFG.lang]||r.en;ix.push({kind:'recipe',k:r.id,tab:r.tab||'',t:y.t,b:y.d||''});});
_searchIdx=ix;_searchSig=sig;return ix;
}
function searchHits(q){
q=String(q||'').trim().toLowerCase();
var ix=searchIndex(),words=q?q.split(/\s+/):[],hits=[];
if(!q)return hits;
ix.forEach(function(e){
var hay=(e.t+' '+e.b).toLowerCase(),ok=true;
for(var i=0;i<words.length;i++)if(hay.indexOf(words[i])<0){ok=false;break;}
if(!ok)return;
var tl=e.t.toLowerCase(),score=0;
for(var j=0;j<words.length;j++)if(tl.indexOf(words[j])>=0)score+=3;
if(tl.indexOf(q)>=0)score+=4;
hits.push({e:e,score:score});
});
hits.sort(function(a,b){return b.score-a.score;});
return hits.slice(0,20);
}
function searchSnippet(body,q){
var w=String(q||'').trim().split(/\s+/)[0]||'';
var b=String(body||''),lo=b.toLowerCase(),i=w?lo.indexOf(w.toLowerCase()):-1;
if(i<0)return b.slice(0,120);
var s=Math.max(0,i-45);
return (s>0?'…':'')+b.slice(s,s+160)+(s+160<b.length?'…':'');
}
function paintSearchResults(q){
var box=$('ssResults');if(!box)return;
q=String(q||'').trim();
var ix=searchIndex();
if(!q){box.innerHTML=hint(ix.length+' '+L('entradas indexadas (fichas, glosario, recetas). Escribe para buscar. Atajos: / o Ctrl+K.','indexed entries (cards, glossary, recipes). Type to search. Shortcuts: / or Ctrl+K.'));return;}
var hits=searchHits(q);
if(!hits.length){box.innerHTML=hint(L('Sin resultados para «','No results for "')+h(q)+L('». Prueba con otra palabra (por ejemplo: safeArea, chroma, D).','". Try another word (for example: safeArea, chroma, D).'));return;}
box.innerHTML=hits.map(function(hit){
var e=hit.e;
var badge=e.kind==='help'?chip(L('Ficha','Card')):e.kind==='gloss'?chip(L('Término','Term')):chip(L('Receta','Recipe'));
return '<div class="card"><h4>'+badge+' '+h(e.t)+'</h4><div class="desc">'+h(searchSnippet(e.b,q))+'</div><div class="btn-row" style="margin-top:6px">'+btn('searchGo',L('Abrir','Open'),'small primary',' data-k="'+h(e.k)+'" data-kind="'+e.kind+'"')+(e.tab?btn('warnGo',L('Ir a ','Go to ')+tabName(e.tab),'small',' data-tab="'+h(e.tab)+'"'):'')+'</div></div>';
}).join('');
}

function ssArmorSVG(svg,kind){

try{doc=new DOMParser().parseFromString(svg,'image/svg+xml');r=doc.documentElement;}catch(e){add('bad','SVG no parseable');return w;}
if(!r||String(r.nodeName).toLowerCase()!=='svg'||doc.getElementsByTagName('parsererror').length){add('bad','SVG inválido');return w;}
var W=480,H=854,vb=r.getAttribute('viewBox');
if(vb){var p=vb.split(/[ ,]+/);W=parseFloat(p[2])||W;H=parseFloat(p[3])||H;}
else{W=parseFloat(r.getAttribute('width'))||W;H=parseFloat(r.getAttribute('height'))||H;add('warn','sin viewBox');}
if(kind==='cover'){
if(!r.querySelector('g'))add('warn','sin grupos de composición');
}else{
['fondo','lejano','medio','sujeto','luz'].forEach(function(id){
var g=r.querySelector('#'+id);
if(!g){add('warn','falta capa '+id);return;}
if(g.getAttribute('data-depth')==null)add('warn','capa '+id+' sin data-depth');
if(!g.getAttribute('data-anchor'))add('warn','capa '+id+' sin data-anchor');
if(g.getAttribute('data-motion')==null)add('warn','capa '+id+' sin data-motion');
});
var suj=r.querySelector('#sujeto');
if(suj&&!suj.querySelector('path,rect,circle,ellipse,polygon,g'))add('warn','capa sujeto vacía');
if(Math.abs(W-480)>2)add('warn','viewBox no normalizado (ancho '+W+')');
try{var med=r.querySelector('#medio');if(med){var rects=med.querySelectorAll('rect');for(var q=0;q<rects.length;q++){var rc=rects[q],rw=parseFloat(rc.getAttribute('width')||'0'),ry=parseFloat(rc.getAttribute('y')||'0'),rh=parseFloat(rc.getAttribute('height')||'0');if(rw>=W*0.9&&ry>=H*0.45&&ry<=H*0.85&&rh>=H*0.08)add('warn','suelo como rect plano (corte duro)');}}}catch(e){}
}
try{if(r.querySelector('feGaussianBlur'))add('warn','desenfoque feGaussianBlur incrustado');}catch(e){}
try{var nf=r.querySelectorAll('filter').length;if(nf>3)add('warn','mas de 3 filtros ('+nf+')');}catch(e){}
if(r.querySelector('text'))add('bad','texto dibujado dentro del SVG');
if(r.querySelector('script,animate,animateTransform,animateMotion,set,foreignObject'))add('bad','animación o script incrustado');
var ext=false;
try{var all=r.querySelectorAll('*');for(var i=0;i<all.length;i++){var el=all[i],hf=el.getAttribute('href')||el.getAttribute('xlink:href')||'';if(/^https?:/i.test(hf))ext=true;var st=el.getAttribute('style')||'';if(/url\(\s*['"]?https?:/i.test(st))ext=true;}}catch(e){}
if(ext)add('bad','recurso externo referenciado');
try{var shapes=r.querySelectorAll('circle,ellipse');for(var s=0;s<shapes.length;s++){var sh=shapes[s],rad=parseFloat(sh.getAttribute('r')||sh.getAttribute('rx')||'0'),op=parseFloat(sh.getAttribute('opacity')||'1');if(rad>W*0.33&&op>=0.18)add('warn','halo/elipse grande (r>'+Math.round(W*0.33)+', op '+op+')');}}catch(e){}
return w;
}

}

}
function partition(s0,e0,cfg,beats){
var D=Math.max(500,cfg.td*1000),range=e0-s0;

for(i=1;i<n;i++){
var x=s0+i*base;

for(var j=0;j<beats.length;j++){
var bt=beats[j].timeMs!==undefined?beats[j].timeMs:beats[j];
if(bt<=x&&bt>b[i-1]){var d=x-bt;if(d<bd){bd=d;best=bt;}}
}
if(best!=null){var cd=best;if(cd-b[i-1]>=minSeg&&cd-b[i-1]<=D&&(base+(x-cd))<=D)x=cd;}

(S.refs||[]).forEach(function(r){

(r.clips||[]).forEach(function(cid){var m=map[cid];if(m&&!seen[m]){seen[m]=1;out.push(m);}});

function genClips(silent){
if(!S.sections.length){if(!silent)toast(L('⚠ Define secciones primero','⚠ Define sections first'),'warn');return;}

pushUndo('gen');
}
var pool={};
S.clips.forEach(function(c){
if(c.manual)return;
var k=c.sectionIdx+'|'+(c.sceneId||0);if(!pool[k])pool[k]=[];
pool[k].push({desc:S.clipDescriptions[c.id],aes:S.clipAesthetics[c.id],scene:S.render.clipScenes[c.id],st:S.clipStatus[c.id],mt:S.clipMeta[c.id]});
});
var out=[];
S.sections.forEach(function(sec,si){

as.forEach(function(a){if(a.startMs>cur)rg.push({s:cur,e:a.startMs,a:null,i:null});rg.push({s:a.startMs,e:a.endMs,a:a,i:S.assignments.indexOf(a)});cur=Math.max(cur,a.endMs);});

rg.forEach(function(r){

if(res.warnMin&&!silent)toast(L('⚠ Mínimo incompatible: gana el techo','⚠ Min conflicts: ceiling wins'),'warn');
var key=si+'|'+(sc?sc.id:0);
res.clips.forEach(function(pc){var m=(pool[key]||[]).shift()||{};var cl=makeClip(0,si,sc?sc.id:null,r.i,pc.startMs,pc.endMs,cfg.td*1000,pc.S);cl._m=m;out.push(cl);});
});
});
S.clips.filter(function(c){return c.manual;}).forEach(function(c){c._m={desc:S.clipDescriptions[c.id],aes:S.clipAesthetics[c.id],scene:S.render.clipScenes[c.id],st:S.clipStatus[c.id],mt:S.clipMeta[c.id]};out.push(c);});
out.sort(function(a,b){return a.startMs-b.startMs;});
out.forEach(function(c,i){c.id=i+1;});
S.clips=out;S.clipDescriptions={};S.clipAesthetics={};S.render.clipScenes={};S.clipStatus={};S.clipMeta={};
out.forEach(function(c){var m=c._m||{};
if(m.desc!=null)S.clipDescriptions[c.id]=m.desc;
if(m.aes!=null&&m.aes>=0)S.clipAesthetics[c.id]=m.aes;
if(m.scene)S.render.clipScenes[c.id]=m.scene;
if(m.st)S.clipStatus[c.id]=m.st;
if(m.mt)S.clipMeta[c.id]=m.mt;

}
function relinkClips(){
var s=S.clips.slice().sort(function(a,b){return a.startMs-b.startMs;});
s.forEach(function(c){c.firstFrameFrom=null;c.firstLastFrame=false;});
for(var i=1;i<s.length;i++){
var a=s[i-1],b=s[i],lk=false;

function snapMs(ms,ex){

S.sections.forEach(function(s,k){if(k!==ex.sec)T.push(s.startMs,s.endMs);});

function nearestIn(arr,t){
if(!arr.length)return t;
var best=arr[0],bd=Infinity;
for(var i=0;i<arr.length;i++){var d=Math.abs(arr[i]-t);if(d<bd){bd=d;best=arr[i];}}
return best;
}
function nearestLine(c){
var best=c.startMs+c.genDurMs/2,bd=Infinity;
S.lines.forEach(function(l){if(l.startMs>c.startMs+250&&l.startMs<c.endMs-250){var d=Math.abs(l.startMs-(c.startMs+c.genDurMs/2));if(d<bd){bd=d;best=l.startMs;}}});
return best;
}
function splitDo(id,t){
var idx=-1;S.clips.forEach(function(x,i){if(x.id===id)idx=i;});if(idx<0)return;
var c=S.clips[idx];
if(!(t>c.startMs+250&&t<c.endMs-250)){toast(L('⚠ Punto de corte inválido','⚠ Invalid cut point'),'warn');return;}
var dup=$('spDupSvg')?$('spDupSvg').checked:true;
var keep=$('spKeepStage')?$('spKeepStage').checked:false;
pushUndo('split');
var oldId=c.id;
var b=clone(c);
b.startMs=t;b.endMs=c.endMs;b.genStartMs=t;b.genEndMs=c.endMs;
c.endMs=t;c.genEndMs=t;
fixClipDur(c);fixClipDur(b);b.manual=c.manual;
S.clips.splice(idx+1,0,b);
var desc=S.clipDescriptions[oldId],aes=S.clipAesthetics[oldId],scn=S.render.clipScenes[oldId],st=S.clipStatus[oldId],mt=S.clipMeta[oldId];
reindexClips();
var newIdx=-1;S.clips.forEach(function(x,i){if(x.startMs===t)newIdx=i;});
var nid=newIdx>=0?S.clips[newIdx].id:oldId+1;
if(desc!=null){S.clipDescriptions[oldId]=desc;S.clipDescriptions[nid]=desc+'\n[CONTINUATION of CLIP '+pad(oldId,2)+']';}
if(aes!=null)S.clipAesthetics[nid]=aes;
if(scn&&dup)S.render.clipScenes[nid]=clone(scn);
if(mt)S.clipMeta[nid]=clone(mt);
S.clipStatus[oldId]=keep&&st?clone(st):{stage:0,note:L('Partido desde el clip original.','Split from the original clip.'),at:Date.now()};
S.clipStatus[nid]={stage:0,note:L('Continuación tras partir.','Continuation after split.'),at:Date.now()};
(S.refs||[]).forEach(function(r){if((r.clips||[]).indexOf(oldId)>=0&&r.clips.indexOf(nid)<0)r.clips.push(nid);});
relinkClips();sceneCache={};closeModal();renderAll();autosave();
toast('✂ '+L('Clip partido en ','Clip split into ')+pad(oldId,2)+' + '+pad(nid,2));
}

function parseCSV(tx){

ev.push({timeMs:Math.round(v*1000),index:idx,label:lab});
});
ev.sort(function(a,b){return a.timeMs-b.timeMs;});
return ev;
}

function normVH(w,hh){return Math.max(120,Math.round(480*(hh||1)/(w||1)));}
function svgSpace(svg){
var w=0,hh=0;
try{
var doc=new DOMParser().parseFromString(svg,'image/svg+xml'),r=doc.documentElement;
var vb=r.getAttribute('viewBox');
if(vb){var p=vb.split(/[ ,]+/);w=parseFloat(p[2])||0;hh=parseFloat(p[3])||0;}
if(!w||!hh){w=parseFloat(r.getAttribute('width'))||0;hh=parseFloat(r.getAttribute('height'))||0;}
}catch(e){}
return {w:w||480,h:hh||270};
}

for(var i=0;i<5;i++){var cx=r()*w,cy=hh*0.15+r()*hh*0.3,rx=w*0.06+r()*w*0.1;s+='<ellipse cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" rx="'+rx.toFixed(1)+'" ry="'+(rx*0.4).toFixed(1)+'" fill="'+col(H0+30,50,32)+'" opacity="0.4"/>';}
s+='</g><g id="medio" data-depth="0.5" data-motion="float" data-anchor="0.5,0.6">';
for(var j=0;j<4;j++){var bx=r()*w*0.8,by=hh*0.45+r()*hh*0.25,bw=w*0.12+r()*w*0.16;s+='<path d="M'+bx.toFixed(1)+' '+(by+hh*0.18).toFixed(1)+' Q'+(bx+bw*0.3).toFixed(1)+' '+by.toFixed(1)+' '+(bx+bw*0.6).toFixed(1)+' '+(by+hh*0.06).toFixed(1)+' T'+(bx+bw).toFixed(1)+' '+(by+hh*0.1).toFixed(1)+' L'+(bx+bw).toFixed(1)+' '+(by+hh*0.2).toFixed(1)+' L'+bx.toFixed(1)+' '+(by+hh*0.2).toFixed(1)+' Z" fill="'+col(H0+15,55,28)+'" opacity="0.7"/>';}
s+='</g><g id="sujeto" data-depth="0.88" data-motion="breathe" data-anchor="0.5,0.55"><path d="M'+(w*0.5)+' '+(hh*0.38)+' C'+(w*0.62)+' '+(hh*0.42)+' '+(w*0.6)+' '+(hh*0.66)+' '+(w*0.5)+' '+(hh*0.7)+' C'+(w*0.4)+' '+(hh*0.66)+' '+(w*0.38)+' '+(hh*0.42)+' '+(w*0.5)+' '+(hh*0.38)+' Z" fill="'+col(H0+10,80,55)+'"/><ellipse cx="'+(w*0.5)+'" cy="'+(hh*0.55)+'" rx="'+(w*0.17)+'" ry="'+(hh*0.1)+'" fill="none" stroke="'+col(H0+10,90,66)+'" stroke-width="'+(w*0.004).toFixed(1)+'" stroke-linecap="round" opacity="0.5"/></g><g id="luz" data-depth="1" data-motion="pulse" data-anchor="0.5,0.4"><rect width="'+w+'" height="'+hh+'" fill="url(#gl)" opacity="0.5"/><path d="M'+(w*0.2)+' 0 L'+(w*0.34)+' 0 L'+(w*0.1)+' '+hh+' L0 '+hh+' Z" fill="'+col(H0+20,90,70)+'" opacity="0.08"/></g></svg>';
