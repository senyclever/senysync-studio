function armorMsg(m){
if(CFG.lang==='es')return m;
var s=String(m||'');
var map={'SVG vacío':'Empty SVG','SVG no parseable':'Unparseable SVG','SVG inválido':'Invalid SVG','sin viewBox':'no viewBox','sin grupos de composición':'no composition groups','capa sujeto vacía':'empty sujeto layer','suelo como rect plano (corte duro)':'ground as flat rect (hard cut)','texto dibujado dentro del SVG':'text drawn inside the SVG','animación o script incrustado':'embedded animation or script','recurso externo referenciado':'external resource referenced','desenfoque feGaussianBlur incrustado':'embedded feGaussianBlur blur','request vacío':'empty request','sin directorContract':'no directorContract','sin universalPrompt':'no universalPrompt','sin artContract':'no artContract','sin clips':'no clips','sin safeArea':'no safeArea','sin aspect':'no aspect','sin coverPlan':'no coverPlan','sin title':'no title'};
var hit=map[s];if(typeof hit==='string')return hit;
var mm;
mm=s.match(/^falta capa (.+)$/);if(mm)return 'missing layer '+mm[1];
mm=s.match(/^capa (.+) sin data-depth$/);if(mm)return 'layer '+mm[1]+' without data-depth';
mm=s.match(/^capa (.+) sin data-anchor$/);if(mm)return 'layer '+mm[1]+' without data-anchor';
mm=s.match(/^capa (.+) sin data-motion$/);if(mm)return 'layer '+mm[1]+' without data-motion';
mm=s.match(/^mas de 3 filtros \((\d+)\)$/);if(mm)return 'more than 3 filters ('+mm[1]+')';
mm=s.match(/^viewBox no normalizado \(ancho (.+)\)$/);if(mm)return 'viewBox not normalized (width '+mm[1]+')';
mm=s.match(/^halo\/elipse grande \(r>(.+), op (.+)\)$/);if(mm)return 'large halo/ellipse (r>'+mm[1]+', op '+mm[2]+')';
mm=s.match(/^(\d+) clips sin dir$/);if(mm)return mm[1]+' clips without dir';
return s;
}

function cycleShot(id,d){
var m=meta(id),items=SHOTS.size.items,i=0;

i=(i+d+items.length)%items.length;

document.addEventListener('keydown',function(e){

if(e.key==='Enter'&&!(e.target&&e.target.closest&&e.target.closest('button,input,select,textarea'))){e.preventDefault();closeHelp();return;}
if(e.key==='Tab')trapFocus($('helpBox'),e);

}
if(e.key==='Escape'){
if($('modal').classList.contains('show')){e.preventDefault();closeModal();return;}
if(STUDIO.busy){e.preventDefault();STUDIO.cancel=true;if(STUDIO.enc)try{STUDIO.enc.close();}catch(x){}return;}
if($('lightbox').classList.contains('show')){$('lightbox').classList.remove('show');UI.lbId=null;return;}

}
if(e.key==='Enter'){
if($('tpModal').classList.contains('show')){e.preventDefault();tpAccept();return;}
if($('modal').classList.contains('show')&&e.target.tagName!=='TEXTAREA'){e.preventDefault();confirmModal();return;}
}
if(e.key==='Tab'){
var tb=null;
if($('tpModal').classList.contains('show'))tb=$('tpBox');
else if($('modal').classList.contains('show'))tb=$('modalBox');
else if($('lightbox').classList.contains('show'))tb=$('lightbox');
if(tb){trapFocus(tb,e);return;}
}
if(rec||STUDIO.busy){if(e.code==='Space')e.preventDefault();return;}
var tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
if(e.target.closest&&e.target.closest('[data-knob]'))return;
if(!CFG.shortcuts)return;
if(e.ctrlKey&&e.code==='KeyZ'){e.preventDefault();undo();return;}
if(e.ctrlKey&&e.code==='KeyY'){e.preventDefault();redo();return;}
if(e.ctrlKey&&e.code==='KeyS'){e.preventDefault();handleAction('saveProject',null);return;}
if(e.ctrlKey&&e.code==='KeyK'){e.preventDefault();openSearch();return;}
if(e.ctrlKey)return;
if(e.code==='Space'){e.preventDefault();togglePlay();return;}
var cur=clipAt(curMs()),cid=cur?cur.id:0;
if(e.altKey&&e.code==='ArrowUp'){e.preventDefault();if(cur)clipMoveAsk(S.clips.indexOf(cur),-1);return;}
if(e.altKey&&e.code==='ArrowDown'){e.preventDefault();if(cur)clipMoveAsk(S.clips.indexOf(cur),1);return;}
if(e.altKey&&e.code==='KeyS'){e.preventDefault();if(cid)handleAction('clipSentToggle',{getAttribute:function(x){return x==='data-id'?String(cid):null;}});return;}
if(e.shiftKey&&e.code==='ArrowUp'){e.preventDefault();if(cid)cycleMotif(cid,-1);return;}
if(e.shiftKey&&e.code==='ArrowDown'){e.preventDefault();if(cid)cycleMotif(cid,1);return;}
if(e.code==='ArrowLeft'||e.code==='ArrowRight'){
e.preventDefault();
var d=e.code==='ArrowRight'?1:-1;
if(e.shiftKey)seekTo(curMs()+d*(1000/(S.fps||24)));
else if(e.altKey){var g=beatGrid();seekTo(d>0?nextGrid(curMs(),g):prevGrid(curMs(),g));}
else seekTo(curMs()+d*1000);
return;
}
if(e.key==='/'){e.preventDefault();openSearch();return;}
if(e.key==='+'||e.key==='='){e.preventDefault();handleAction('zoomIn',null);return;}
if(e.key==='-'){e.preventDefault();handleAction('zoomOut',null);return;}
if(e.key==='0'){e.preventDefault();UI.zoom=1;UI.zoomTarget=1;UI.scrollMs=0;updateZoomUI();drawTimeline();drawPlayhead(curMs());return;}
if(e.key===','||e.key==='.'){
e.preventDefault();var dd=e.key==='.'?1:-1;
if(e.shiftKey){
var si=-1;S.sections.forEach(function(s,i2){if(curMs()>=s.startMs&&curMs()<s.endMs)si=i2;});
var ns=S.sections[clamp(si+dd,0,S.sections.length-1)];if(ns)seekTo(ns.startMs);
}else{
var ci=cur?S.clips.indexOf(cur):-1,nc=S.clips[clamp(ci+dd,0,S.clips.length-1)];if(nc)seekTo(nc.startMs);
}
return;
}
switch(e.code){
case 'KeyR':e.preventDefault();handleAction('loopCycle',null);break;
case 'KeyB':e.preventDefault();if(cid)offerSplit(cid,false);break;
case 'KeyQ':e.preventDefault();if(cid)cycleShot(cid,-1);break;
case 'KeyW':e.preventDefault();if(cid)cycleShot(cid,1);break;
case 'KeyV':e.preventDefault();handleAction('toggleShots',null);break;
case 'KeyN':e.preventDefault();handleAction('toggleMotif',null);break;
case 'KeyG':e.preventDefault();CFG.renderGrid=!CFG.renderGrid;renderAll();autosave();break;
case 'KeyE':e.preventDefault();openStudio('mp4');break;
case 'KeyI':e.preventDefault();handleAction('smartImport',null);break;
case 'KeyH':e.preventDefault();openHelp(TAB_HELP[UI.tab]||'timeline');break;
case 'KeyL':if(UI.tab==='timeline'){e.preventDefault();handleMark('line');}break;
case 'KeyM':if(UI.tab==='timeline'){e.preventDefault();handleMark('sec');}break;
case 'KeyS':if(UI.tab==='timeline'){e.preventDefault();handleMark('scn');}break;
case 'KeyC':if(UI.tab==='timeline'){e.preventDefault();handleMark('clip');}break;
}
if(e.key==='?'){e.preventDefault();helpKeys();}
});
