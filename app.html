function parseScene(svg,w,hh){
try{
var doc=new DOMParser().parseFromString(svg,'image/svg+xml'),r=doc.documentElement;
if(r.nodeName.toLowerCase()!=='svg')return null;
var W=w,H=hh,vb=r.getAttribute('viewBox');
if(vb){var p=vb.split(/[ ,]+/);W=parseFloat(p[2])||w;H=parseFloat(p[3])||hh;}
var df=r.querySelector('defs'),ds=df?new XMLSerializer().serializeToString(df):'';
var nodes=[].slice.call(r.children).filter(function(n){var t=n.nodeName.toLowerCase();return t!=='defs'&&t!=='title'&&t!=='desc';});
if(nodes.length===1&&nodes[0].children&&nodes[0].children.length>1){
var parent=nodes[0],kids=[].slice.call(parent.children);
var pdf=parent.querySelector('defs');if(pdf)ds+=new XMLSerializer().serializeToString(pdf);
nodes=kids;
}
var layers=[];
nodes.forEach(function(n,i){
var d=parseFloat(n.getAttribute('data-depth'));if(isNaN(d))d=nodes.length>1?i/(nodes.length-1):0.5;
var an=(n.getAttribute('data-anchor')||'0.5,0.5').split(',');
var motion=n.getAttribute('data-motion')||(nodes.length===1?'kenburns':'float');
var bl=n.getAttribute('data-blend')||'source-over';
var frag=new XMLSerializer().serializeToString(n),useDs=/url\(\s*['"]?#|href\s*=\s*['"]#/i.test(frag)?ds:'';
layers.push({svg:'<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+useDs+frag+'</svg>',depth:clamp(d,0,1),motion:motion,blend:bl,ax:parseFloat(an[0])||0.5,ay:parseFloat(an[1])||0.5,phase:rng(i*97+13)()*6.283,isBg:(n.getAttribute('id')==='fondo'||(i===0&&d<=0.08))});
});
return {w:W,h:H,layers:layers};
}catch(e){return null;}
}
function rasterizeScene(id,svg,w,hh,done){
var p=parseScene(svg,w,hh);
if(!p||!p.layers.length){sceneCache[id]={ready:false,layers:[]};done(false);return;}
var sc=Math.min(1,CFG.rasterCap/Math.max(p.w,p.h)),cw=Math.max(2,Math.round(p.w*sc)),ch=Math.max(2,Math.round(p.h*sc));
var e={w:p.w,h:p.h,layers:[],ready:false},left=p.layers.length,fail=false;
p.layers.forEach(function(Lm,i){
var img=new Image(),url=URL.createObjectURL(new Blob([Lm.svg],{type:'image/svg+xml'}));
img.onload=function(){
var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
cv.getContext('2d').drawImage(img,0,0,cw,ch);URL.revokeObjectURL(url);
e.layers[i]={cv:cv,depth:Lm.depth,motion:Lm.motion,blend:Lm.blend,ax:Lm.ax,ay:Lm.ay,phase:Lm.phase,isBg:Lm.isBg};
if(--left===0){e.ready=!fail;sceneCache[id]=e;done(!fail);}
};
img.onerror=function(){URL.revokeObjectURL(url);fail=true;if(--left===0){sceneCache[id]=e;done(false);}};
img.src=url;
});
}
function clipIndexById(id){for(var i=0;i<S.clips.length;i++)if(S.clips[i].id===id)return i;return -1;}
function clipAt(ms){var c=null;for(var i=0;i<S.clips.length;i++){if(S.clips[i].startMs<=ms)c=S.clips[i];else break;}return c||S.clips[0]||null;}
function ensureWindow(ms,cb){
var c=clipAt(ms),idx=c?S.clips.indexOf(c):-1,need=[];
S.clips.forEach(function(cl,i){
if(idx>=0&&Math.abs(i-idx)>1)return;
var s=S.render.clipScenes[cl.id];
if(s&&s.svg&&!sceneCache[cl.id])need.push(cl);
});
Object.keys(sceneCache).forEach(function(k){var ki=clipIndexById(+k);if(ki>=0&&idx>=0&&Math.abs(ki-idx)>1)delete sceneCache[k];});
if(!need.length){if(cb)cb();return;}
sceneLoading=true;var left=need.length;
need.forEach(function(cl){rasterizeScene(cl.id,S.render.clipScenes[cl.id].svg,S.res.w,S.res.h,function(){if(--left===0){sceneLoading=false;if(cb)cb();}});});
}
function ensureWindowP(ms){return new Promise(function(res){ensureWindow(ms,function(){res();});});}
function rafP(){return new Promise(function(r){requestAnimationFrame(function(){r();});});}
function encDrain(enc){
if(!enc||enc.encodeQueueSize<=6)return Promise.resolve();
return rafP().then(function(){return encDrain(enc);});
}
function ensureScenes(cb){ensureWindow(curMs(),cb);}
function seekVideoTo(ms){
return new Promise(function(res){
if(!usingVideo()||!videoEl){res(false);return;}
var dur=videoEl.duration||0,t=clamp(ms/1000,0,Math.max(0,dur-0.04));
if(videoEl.readyState>=2&&Math.abs(videoEl.currentTime-t)<0.002){res(true);return;}
var done=false,to=null;
function fin(ok){if(done)return;done=true;try{videoEl.removeEventListener('seeked',onSeek);}catch(e){}if(to)clearTimeout(to);res(ok);}
function onSeek(){fin(true);}
try{videoEl.addEventListener('seeked',onSeek);}catch(e){}
to=setTimeout(function(){fin(videoEl.readyState>=2);},2500);
try{videoEl.currentTime=t;}catch(e){fin(false);}
});
}
function nalUnits(b){
var out=[],i=0,n=b.length,start=-1,e;
while(i<n){
var sc=0;
if(i+2<n&&b[i]===0&&b[i+1]===0&&b[i+2]===1)sc=3;
else if(i+3<n&&b[i]===0&&b[i+1]===0&&b[i+2]===0&&b[i+3]===1)sc=4;
if(sc){
if(start>=0){e=i;while(e>start&&b[e-1]===0)e--;out.push(b.subarray(start,e));}
start=i+sc;i=start;
}else i++;
}
if(start>=0){e=n;while(e>start&&b[e-1]===0)e--;out.push(b.subarray(start,e));}
return out;
}
function avccFromAnnexb(key){
var us=nalUnits(key),sps=null,pps=null,i,t;
for(i=0;i<us.length;i++){t=us[i][0]&0x1f;if(t===7&&!sps)sps=us[i];else if(t===8&&!pps)pps=us[i];}
if(!sps||!pps||sps.length<4)return null;
var b=new Uint8Array(11+sps.length+pps.length),o=0;
b[o++]=1;b[o++]=sps[1];b[o++]=sps[2];b[o++]=sps[3];b[o++]=0xff;b[o++]=0xe1;
b[o++]=(sps.length>>8)&255;b[o++]=sps.length&255;b.set(sps,o);o+=sps.length;
b[o++]=1;b[o++]=(pps.length>>8)&255;b[o++]=pps.length&255;b.set(pps,o);
return b;
}
function annexbToAvcc(b){
var us=nalUnits(b),tot=0,i;
for(i=0;i<us.length;i++)tot+=4+us[i].length;
var out=new Uint8Array(tot),o=0;
for(i=0;i<us.length;i++){var L=us[i].length;out[o++]=(L>>>24)&255;out[o++]=(L>>>16)&255;out[o++]=(L>>>8)&255;out[o++]=L&255;out.set(us[i],o);o+=L;}
return out;
}
function fillBaseScenes(){
if(!S.clips.length){toast(L('⚠ Sin clips','⚠ No clips'),'warn');return;}
mutate('base scenes',function(){S.clips.forEach(function(c){var av=aesOf(c);S.render.clipScenes[c.id]={svg:baseSceneSVG(c,480,normVH(S.res.w,S.res.h),av>=0?hue(aesName(av)):hue('clip'+c.id)),title:'',store:'internal'};});});
sceneCache={};ensureWindow(curMs(),function(){drawRenderFrame(curMs());});
toast(L('🧩 Escenas base generadas','🧩 Base scenes generated'));
}
function fxFilter(){
var f=[];
if(CFG.fSat!==1)f.push('saturate('+CFG.fSat+')');
if(CFG.fBright!==1)f.push('brightness('+CFG.fBright+')');
if(CFG.fContrast!==1)f.push('contrast('+CFG.fContrast+')');
if(CFG.fHue!==0)f.push('hue-rotate('+CFG.fHue+'deg)');
if(CFG.fBlur>0)f.push('blur('+CFG.fBlur+'px)');
return f.length?f.join(' '):'none';
}
function drawChecker(ctx,w,hh){
var s=Math.max(12,Math.round(w/40));
ctx.fillStyle='#3a3a46';ctx.fillRect(0,0,w,hh);
ctx.fillStyle='#2a2a34';
for(var y=0;y<hh;y+=s)for(var x=(y/s%2)*s;x<w;x+=s*2)ctx.fillRect(x,y,s,s);
}
function renderOutSize(q){
var s=Math.max(0.1,q||1),w=Math.max(2,Math.round(S.res.w*s)),hh=Math.max(2,Math.round(S.res.h*s));
if(w%2)w++;if(hh%2)hh++;
return {w:w,h:hh};
}
function drawSceneFrame(ctx,ms,w,hh,exp){
var transparent=S.render.bg==='transparent';
if(transparent){if(!exp)drawChecker(ctx,w,hh);}
else{ctx.fillStyle=S.render.bg||'#000';ctx.fillRect(0,0,w,hh);}
var src=S.visualSource||'svg';
if(usingVideo()&&src!=='svg'&&videoEl.readyState>=2){
var vw=videoEl.videoWidth||w,vh=videoEl.videoHeight||hh,sc=Math.max(w/vw,hh/vh),dw=vw*sc,dh=vh*sc;
ctx.drawImage(videoEl,(w-dw)/2,(hh-dh)/2,dw,dh);
}
var c=clipAt(ms),drawArt=(src==='svg'||src==='mix');
if(drawArt&&c){
var av=aesOf(c),H0=(hue(av>=0?aesName(av):'clip'+c.id)+CFG.vHueShift)%360,scn=sceneCache[c.id];
if(!scn||!scn.ready){
if(src==='svg'&&!exp){
var g=ctx.createLinearGradient(0,0,w,hh);g.addColorStop(0,'hsl('+H0+',55%,8%)');g.addColorStop(1,'hsl('+((H0+50)%360)+',60%,14%)');
ctx.fillStyle=g;ctx.fillRect(0,0,w,hh);
ctx.fillStyle='rgba(216,216,232,.65)';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=Math.round(w*0.02)+'px sans-serif';
ctx.fillText(sceneLoading?L('Cargando escenas…','Loading scenes…'):L('Sin escena — importa SVG o pulsa Escena base','No scene — import SVG or press Base scene'),w/2,hh/2);
ctx.textBaseline='alphabetic';
}
}else{
if(filterOK===null){filterOK=(typeof ctx.filter==='string');if(!filterOK&&!exp)toast(L('⚠ ctx.filter no soportado: corrección degradada','⚠ ctx.filter unsupported: correction degraded'),'warn');}
var loc=(ms-c.startMs)/1000,dur=Math.max(0.001,(c.endMs-c.startMs)/1000),ph=beatPhase(ms);
var motion=CFG.vMotion,pulse=motion?Math.pow(1-ph,3)*CFG.vIntensity:0;
ctx.save();
ctx.globalAlpha=clamp(CFG.fOpacity,0,1)*(src==='mix'?0.9:1);
if(filterOK)ctx.filter=fxFilter();
var fs=CFG.fScale||1;
ctx.translate(w/2+CFG.fX*w,hh/2+CFG.fY*hh);ctx.scale(fs,fs);ctx.translate(-w/2,-hh/2);
scn.layers.forEach(function(Ly,i){
if(!Ly)return;
if(S.render.hideSvgBg&&Ly.isBg)return;
var e=motion?((i===0)?1:easeOut(clamp((loc-i*0.12)/0.6,0,1))):1,dp=Ly.depth;
var a1=motion?Math.sin(ms/1000*CFG.vSpeed*0.6+Ly.phase):0,a2=motion?Math.cos(ms/1000*CFG.vSpeed*0.4+Ly.phase*1.7):0;
var px=a1*w*0.012*(0.3+dp),py=a2*hh*0.010*(0.3+dp),scl=0.96+0.04*e,rot=0;
if(motion){
if(Ly.motion==='pulse')scl+=pulse*0.04;
if(Ly.motion==='breathe')scl+=Math.sin(ms/1400+Ly.phase)*0.015;
if(Ly.motion==='spin')rot=Math.sin(ms/2000+Ly.phase)*0.05;
if(Ly.motion==='rise')py-=loc*hh*0.01;
if(Ly.motion==='kenburns'){scl=1+0.08*clamp(loc/dur,0,1);px+=Math.sin(loc*0.3)*w*0.02;py+=Math.cos(loc*0.2)*hh*0.015;}
}else scl=1;
var op=e;
if(i===scn.layers.length-1&&motion)op*=clamp(0.4+0.6*CFG.vGlow*(0.6+pulse*0.4),0,1);
if(motion){op*=clamp((dur-loc)/0.25,0,1);if(i===0)op=1;else op*=clamp(loc/0.15,0,1);}
ctx.save();ctx.globalAlpha*=clamp(op,0,1);
if(Ly.blend&&Ly.blend!=='source-over')ctx.globalCompositeOperation=Ly.blend;
var ax=Ly.ax*w,ay=Ly.ay*hh;
ctx.translate(ax,ay);ctx.rotate(rot);ctx.scale(scl,scl);ctx.translate(-ax,-ay);
ctx.drawImage(Ly.cv,px,py,w,hh);ctx.restore();
});
if(motion){
var r=rng(c.id*31+7),n=Math.round(CFG.vParticles);
for(var i2=0;i2<n;i2++){
var dx=r(),dy=r(),ps=r()*6.283,vr=1-CFG.vPVar+r()*CFG.vPVar*2;
var x=(dx*w+Math.sin(ms/1000*CFG.vSpeed+ps)*w*0.02+w)%w,y=(dy*hh+Math.cos(ms/1300*CFG.vSpeed+ps)*hh*0.02+hh)%hh;
ctx.beginPath();ctx.arc(x,y,Math.max(0.5,(0.004*CFG.vPSize*vr)*w*(1+pulse*0.3)),0,6.283);
ctx.fillStyle='hsla('+((H0+i2*17)%360)+',85%,65%,'+(0.05+0.06*CFG.vGlow+pulse*0.05)+')';ctx.fill();
}
}
ctx.restore();

function probeEncoder(w,h,fps,codec,format){

var got=0,err=null,desc=false,enc;
try{
enc=new VideoEncoder({output:function(chunk,meta){got=chunk.byteLength;if(meta&&meta.decoderConfig&&meta.decoderConfig.description)desc=true;},error:function(e){err=e;}});
enc.configure({codec:codec,width:w,height:h,bitrate:1200000,framerate:fps,avc:{format:format},latencyMode:'realtime'});
}catch(e){res({ok:false,why:e.message||String(e)});return;}
try{
var cv=document.createElement('canvas');cv.width=w;cv.height=h;
var cx=cv.getContext('2d');cx.fillStyle='#101018';cx.fillRect(0,0,w,h);
var vf=new VideoFrame(cv,{timestamp:0,duration:Math.round(1000000/fps)});
enc.encode(vf,{keyFrame:true});vf.close();
enc.flush().then(function(){
try{enc.close();}catch(e){}
if(err)res({ok:false,why:err.message||String(err)});
else if(!got)res({ok:false,why:L('el codificador no entregó datos','encoder produced no data')});
else if(format==='avc'&&!desc)res({ok:false,why:L('sin descriptor avcC','no avcC descriptor')});
else res({ok:true});
}).catch(function(e){try{enc.close();}catch(x){}res({ok:false,why:e.message||String(e)});});
}catch(e){try{enc.close();}catch(x){}res({ok:false,why:e.message||String(e)});}
});
}

function pngSequence(){

pausePlayback();

}).then(function(){
drawSceneFrame(ctx,ms,d.w,d.h,true);
return new Promise(function(r){cv.toBlob(r,'image/png');});
}).then(function(blob){

}).then(function(buf){
files.push({name:'frame_'+pad(i+1,5)+'.png',data:new Uint8Array(buf)});
i++;
stProg(i/rg.n,L('Lote','Batch')+' '+(p+1)+'/'+parts+' · '+i+'/'+rg.n+' frames');
return (i%3===0)?rafP().then(step):step();
});
};
return step().then(function(){

function mp4Render(){
var caps=UI._caps;
if(!caps||!caps.mp4){toast(L('⚠ MP4 no soportado aquí: usa WebM o PNG','⚠ MP4 not supported here: use WebM or PNG'),'err');return;}
var rg=studioRange(),fps=S.fps||24,d=renderOutSize(CFG.mp4Scale);
var annexb=(caps.mp4Format==='annexb'),needVideo=(S.visualSource==='video'||S.visualSource==='mix');
pausePlayback();
STUDIO.busy=true;STUDIO.cancel=false;
var cv=document.createElement('canvas');cv.width=d.w;cv.height=d.h;
var ctx=cv.getContext('2d',{alpha:false});
var samples=[],desc=null,err=null;
var enc=new VideoEncoder({output:function(chunk,meta){
var b=new Uint8Array(chunk.byteLength);chunk.copyTo(b);
if(annexb){
if(chunk.type==='key'&&!desc)desc=avccFromAnnexb(b);
b=annexbToAvcc(b);
}else if(meta&&meta.decoderConfig&&meta.decoderConfig.description&&!desc){
var dd=meta.decoderConfig.description;
desc=dd instanceof Uint8Array?dd:new Uint8Array(dd.buffer||dd);
}
samples.push({data:b,key:chunk.type==='key'});
},error:function(e){err=e;}});
STUDIO.enc=enc;
try{enc.configure({codec:caps.mp4Codec,width:d.w,height:d.h,bitrate:CFG.mp4Bitrate*1000000,framerate:fps,avc:{format:caps.mp4Format},latencyMode:'quality'});}

var kf=Math.max(1,Math.round(fps*CFG.mp4KeySec)),f=0;
stProg(0,L('Preparando H.264','Preparing H.264'));
var step=function(){
if(STUDIO.cancel||err||f>=rg.n)return Promise.resolve();
var t=rg.t0+f*1000/fps;
return ensureWindowP(t).then(function(){
if(needVideo)return seekVideoTo(t);
}).then(function(){
drawSceneFrame(ctx,t,d.w,d.h,true);
var vf=new VideoFrame(cv,{timestamp:Math.round(f*1000000/fps),duration:Math.round(1000000/fps)});
enc.encode(vf,{keyFrame:f%kf===0});vf.close();
f++;
return encDrain(enc);
}).then(function(){
if(f%3===0){stProg(f/rg.n,L('Codificando H.264','Encoding H.264')+' · '+f+'/'+rg.n);return rafP().then(step);}
return step();
});
};
step().then(function(){
if(STUDIO.cancel||err)return;
return enc.flush().then(function(){
try{enc.close();}catch(e){}
if(!desc){toast(L('⚠ El codificador no entregó avcC. Usa WebM o PNG.','⚠ Encoder gave no avcC. Use WebM or PNG.'),'err');return;}
stProg(1,L('Multiplexando MP4','Muxing MP4'));
return rafP().then(function(){
return saveBlob(sn(S.projectName)+'_render.mp4',mp4Mux(samples,desc,d.w,d.h,fps),'mp4','video/mp4',true);
});
});
}).then(function(){
STUDIO.busy=false;STUDIO.enc=null;closeModal();renderAll();
if(err)toast('⚠ '+err.message,'err');
else if(STUDIO.cancel)toast(L('Exportación cancelada','Export cancelled'),'warn');
else if(!desc)toast(L('Exportación MP4 fallida','MP4 export failed'),'err');
else toast(L('🎬 MP4 exportado (solo video)','🎬 MP4 exported (video only)'));
}).catch(function(e){
STUDIO.busy=false;STUDIO.enc=null;closeModal();renderAll();
toast('⚠ '+(e&&e.message?e.message:e),'err');
});
}

'──────────────────────────────────────────────',
'🧭 QUÉ ES','Estudio local 4-en-1 para videoclips con IA: letra y timing, guion cinematográfico, Render SVG animado, Portadas SVG y composición sobre video real.','Todo ocurre en tu navegador: sin servidores, sin cuentas, sin subidas, sin librerías externas. Funciona en escritorio y teléfono.','',
'⭐ TODO GIRA EN TORNO AL TIMELINE','Config define el reloj (BPM o CSV) o el video importado lo define por ti. Secciones son la arquitectura global; Letra, Escenas, Clips, Motivo, Planos y Referencias se montan sobre él.','',
'🚀 FLUJO A (la IA crea los clips)','1) Config: audio o video, reloj, duración, FPS, resolución. 2) Secciones. 3) Letra. 4) Creativo: biblia y prompt universal. 5) Exportar Guion para IA en modo AUTORIZAR. 6) Importar el JSON. NO pulses Generar después.','Recuerda siempre guardar tu proyecto en "📥 Exportar / 💾 Proyecto .json" al terminar cada paso. Luego podrás importar tu progreso con ese archivo.','',
'🚀 FLUJO B (tú creas los clips)','1) Secciones. 2) Defaults de clips (Duración Objetivo). 3) Generar Clips. 4) Letra. 5) Exportar Guion para IA en modo RELLENAR: tus clips viajan bloqueados y la IA solo escribe prompts, escenas y estéticas. 6) Importar eligiendo Conservar mis clips.','Recuerda siempre guardar tu proyecto en "📥 Exportar / 💾 Proyecto .json" al terminar cada paso. Luego podrás importar tu progreso con ese archivo.','',
'🥁 RELOJ BPM / CSV','El CSV de Sonic Visualiser puede gobernar el reloj igual que el BPM, con rejilla irregular que sigue el tempo real.','Sonic Visualiser: File / Open → Transform / Analysis by Category / Time / Tempo / Bar and Beat Tracker: Bars → File / Export Annotation Layer.','Indica si cada fila es BEAT o COMPÁS. Bars suele entregar una fila cada 1 o 2 compases: con Span automático la app compara la mediana del CSV con el compás del BPM y lo deduce.','El CSV tiene su PROPIO offset, independiente del BPM, para corregir el pequeño error de detección.','Jerarquía: por defecto manda el BPM si ambos están cargados; puedes invertirla. Sin BPM, el CSV manda automáticamente.','La app avisa si el CSV y el BPM discrepan, y ofrece Adoptar BPM del CSV.','',
'🎵 TIMELINE','Bandas: Secciones · Escenas · Clips · Líneas · [Motivo] · [Planos] · Onda · Beats/CSV · Regleta.','El texto de cada barra se recorta dentro de su propio rectángulo: nunca invade la barra vecina.','Rueda = zoom · Alt/Shift+rueda = scroll · dos dedos = pinch · pulsación larga = menú · doble tap = zoom a la selección · vibración al snap.','Tocar la fila de Motivo o de Planos abre su editor directamente.','',
'🎯 FILA DE MOTIVO','Mapa de continuidad del símbolo recurrente. 12 códigos fijos M0–M11, cada uno con color e icono propios, iguales en todos los proyectos.','El SIGNIFICADO es por proyecto: lo escribes tú o lo define la IA y llega en el JSON. Pulsa Leyenda para verlo y editarlo.','M11 Excepción debería aparecer una sola vez; la app avisa si se repite.','','🔁 LOOP','Ciclo: Desactivado → 2 compases → 4 compases → 8 compases → Clip → Todo. Botón Loop o tecla R.','Los modos por compás respetan el Compás de Config y la rejilla activa (BPM o CSV): se anclan al compás musical en o antes de la aguja, y se re-anclan al hacer seek.','La ventana de loop se ve en el Timeline como una banda tenue con bordes discontinuos. El toast muestra el modo y su duración.','El bucle lo garantiza el hilo de audio: la aguja no se escapa aunque cambies de pestaña.','',
'🧲 SNAP Y 🔒 CANDADO','Snap es un solo botón cíclico: Libre → Bordes → Beat → Compás → Todo. Cada cambio muestra un toast de una palabra y vibra al enganchar.','El Candado (🔒 D) bloquea el resize al techo de duración objetivo: toast "Bloqueado a duración objetivo" o "Duración libre".','',
'🎯 SEGUIR AGUJA','Con Seguir activo, al reproducir la vista desplaza el Timeline para mantener la aguja a la vista cuando sale del 60% central. Solo actúa con zoom > 1.','Si mueves el scrollbar a mano, puedes desactivar Seguir para no pelear con la vista. El botón muestra el estado activo.','',
'🛡 PANELES DE AVISOS','Al final de Render SVG y Portadas SVG hay un panel "🛡 Avisos del blindaje (N)" plegado por defecto. Despliega con ▼ para ver el detalle por clip o por portada.','En móvil el detalle usa scroll interno (40vh) para no ocupar toda la pantalla. Amarillo = aviso; rojo = defecto.','Se actualiza al reimportar escenas SVG y se limpia al borrar una portada. Son hechos mecánicos, no un juicio creativo.','',
'🎬 FILA DE PLANOS','Vocabulario cerrado en seis categorías: escala, angulación, punto de vista, sujetos, movimiento y función de montaje.','Orden canónico SIZE/ANGLE/POV/CAST/MOVE/FUNC omitiendo neutros: PM / ESC / FIJ.','La alimenta la IA, la app puede inferirla del prompt, o tú a mano. Es opcional y está oculta por defecto.','Para aprender cada código (GPG, PM, PP, ESC, CTP…) pulsa el ? de Planos: abre una guía completa con la descripción de todos los tipos y cómo grabarlos.','Sirve para detectar monotonía (4+ clips seguidos con la misma escala), escenas nuevas sin plano de situación y clímax sin primer plano.','',
'★ CENTINELAS','Marca tres clips de prueba (héroe+set, entidad+caos, clímax) y exporta solo esos. Si pasan tu revisión, el lote saldrá coherente.','No son clips nuevos: son marcas sobre clips existentes. Conservan sus IDs originales al exportar.','',
'✅ CHECKLIST','Cada clip tiene estado: Pendiente → Enviado → Generado → Aprobado / Descartado, con nota. La barra suma solo APROBADOS.','Filtra por estado antes de cada sesión de generación. Exporta el checklist en .txt.','',
'↑↓ REORDENAR CLIPS','Modo 1 · Intercambiar contenido: los tiempos NO se mueven; viajan prompt, estética, escena SVG, motivo, planos, estado y referencias. Riesgo cero.','Modo 2 · Mover en el tiempo: intercambian posición conservando cada uno su duración; se recalculan fronteras, sección, escena y first-frame.','La app siempre pregunta y explica. Ctrl+Z revierte.','',

'Dos registros apagados por defecto, solo en este navegador, en claves separadas del proyecto. No se suben a ningún sitio y no guardan contenido de tu obra.',
'Registro de uso (panel en Exportar): pestañas visitadas, acciones, fichas de ayuda abiertas, avisos por tipo, exports por formato e imports confirmados o fallidos.',
'Registro de lote (panel en Exportar e interruptor en Configuración avanzada): vincula cada export con su import posterior. Guarda modo LEAN o RICH, número de clips, marca de centinela, modelo etiquetado a mano, tiempo de retorno, escenas válidas sobre total y avisos del blindaje agregados.',
'En un lote de Guion las escenas son narrativas y el contador de blindaje es 0 porque el blindaje de SVG no aplica a un guion: ese 0 significa no aplicable, no auditado y limpio.',
'Exportar registro descarga un JSON con conteos y eventos. Purgar borra solo su clave; tu proyecto y tu obra no se tocan. Al desactivar se purga, por privacidad.',
'El respaldo del proyecto no incluye ninguno de los dos registros.','',
'📤 CONTRATOS PARA IA · LEAN Y RICH','Guion para IA es el contrato maestro: guarda la capa musical, narrativa, clips, estéticas, motivo, planos, referencias y canon. Es el que no deja escapar nada.','Render SVG y Portada SVG tienen dos modos con el interruptor "Contrato de arte ligero" (Configuración avanzada):','· LEAN (por defecto): contrato mínimo probado. Viajan clips con su dir, estética y una espina narrativa (section, scene y lines con la letra que cruza el clip), biblia del proyecto, contrato breve de director, prompt universal, estéticas, motivo, refs y safeArea. Menos contexto = más atención al dibujo. Es el modo recomendado para arte.','· RICH: añade story (secciones, escenas, asignaciones, letra con energía), canon completo (model sheets) y taxonomía de planos. Úsalo cuando necesites máxima unificación o trabajes por lotes con canon.','En ambos modos el contrato de director viaja SIEMPRE como intent.directorContract, separado de tus notas (intent.bible).','El idioma del JSON es el de la interfaz; en español la app ofrece cambiar a inglés solo para ese export.','',
'🧬 CANON','El canon (canon.characters/sets/motifs) son model sheets reutilizables: una anatomía continua por personaje, cabeza unida al torso, piernas unidas al torso, paleta congelada.','La IA de guion lo devuelve y la app lo guarda en el proyecto. En modo RICH se inyecta en render y portada para que el mismo diseño se repita byte-idéntico (solo translate/scale y luz).','Si el canon está vacío, la IA lo construye en el clip 1 y lo devuelve en result.canon.','',
'🎨 ACABADO, PUESTA EN ESCENA Y COLOR','El contrato de director pide: silueta primero y detalle después; materiales legibles (piedra, metal, tela, pluma, piel); volumen con degradados, borde de luz y sombra de contacto; paths limpios.','Puesta en escena: cada personaje en su zona legible, sin superposición accidental de alas, brazos o props, salvo que el guion lo pida. Props anclados a la mano. Nada flota sin motivo.','Color: una LUT de show, colores de personaje congelados, temperatura/valor por estética, luz con multiply/screen. Color vivo y cohesivo, no neón sucio.','El estilo lo definen TU Prompt Universal y TUS estéticas; la app no impone un acabado de la casa.','',
'🤖 QUÉ MODELO USAR PARA EL ARTE','Dibujar SVG a ciegas es difícil para un LLM. Usa un modelo fuerte en SVG espacial (por ejemplo Gemini, el que produjo el buen castillo) para Render y Portada.','Los modelos más débiles tienden a primitivas geométricas. Si los usas, trabaja en LEAN y en lotes pequeños por escena o familia, nunca 33 clips de golpe.','El acabado geométrico no es un fallo de la app: es capacidad del modelo. La app garantiza integridad, continuidad y un contrato limpio; el modelo pone el talento de dibujo.','',
'💬 SUBTÍTULOS Y ÁREA SEGURA','La letra viaja como story.lines[].text con su energía E0-E3 (en RICH). La app superpone los subtítulos: la IA nunca dibuja texto.','safeArea es la banda inferior donde irá la letra: la IA debe dejarla limpia y de bajo contraste, como continuación del set, nunca una banda negra plana.','Las figuras se apoyan en una línea de suelo POR ENCIMA de safeArea, con sombra de contacto pequeña.','',
'🛡 BLINDAJE NIVEL 2','Es una auditoría de solo lectura, no bloqueante. No juzga belleza ni narrativa: revisa hechos mecánicos.','Al EXPORTAR: verifica que el request lleve directorContract, universalPrompt, artContract, safeArea (render) y aspect/coverPlan/title (portada), y que ningún clip quede sin dir. Si falta algo, avisa en notificaciones pero exporta igual.','Al IMPORTAR: revisa que el SVG parsea, que tiene las cinco capas con data-depth y data-anchor (render) o grupos libres (portada), que no trae texto, scripts, animación ni recursos externos, que el viewBox está normalizado, que no hay un halo/elipse gigante ni un suelo como rect plano de corte duro.','Los avisos aparecen en notificaciones y en el toast (🛡). Nunca rechaza ni modifica el SVG. Si el blindaje falla, el flujo normal continúa.','',
'🎬 ESTUDIO DE EXPORTACIÓN','MP4 H.264: WebCodecs + multiplexor MP4 nativo. Render OFFLINE frame a frame, sin pérdida de fotogramas. Solo video.','WebM VP9/VP8 + Opus: grabación en tiempo real con audio.','Secuencia PNG en ZIP por bloques configurables (24, 60, 120 o 240 frames; 60 por defecto) para no agotar la memoria del teléfono.','El informe de capacidades prueba tu navegador antes de ofrecer cada formato. Al terminar un WebM la app ofrece abrir el Estudio para generar un MP4: es un render nuevo desde el proyecto, no una conversion del WebM.','',
'🎛 PERILLAS EN TELÉFONO','El gesto vertical hace scroll de página; el horizontal ajusta el valor. Toque simple: editor con slider grande, −/+ y campo numérico.','Doble toque: valor por defecto. Shift o interruptor: modo fino. Rueda y flechas también funcionan.','',
'❓ AYUDA Y ATAJOS','Todos los iconos "?" abren una ficha con qué es, por qué importa y cómo se conecta con el Timeline.','Pulsa H o ? para la ayuda de la pestaña, o el icono de llave para ver todos los atajos. Se desactivan en Configuración avanzada.','',
'🧰 PROBLEMAS','Sin audio al primer clic: pulsa play otra vez. Huecos: revisa Validación. Rojo: el clip excede D, pártelo.','Autoguardado lleno: mueve escenas a IndexedDB o exporta respaldo .json.','Exportación pesada: baja la escala en el Estudio antes que la resolución del proyecto.','MP4 no aparece: tu navegador no puede codificar H.264; usa WebM o PNG.','Personajes geométricos o sin acabado: cambia a un modelo fuerte en SVG, usa LEAN y lotes pequeños.','Avisos 🛡 al importar: revisa notificaciones; son hechos mecánicos, no un juicio creativo.','',
'',
'──────────────────────────────────────────────',
'🔎 BUSCADOR, GLOSARIO Y RECETAS',
'La lupa de la cabecera, entre Importar y Atajos, abre el buscador transversal. Atajos: / o Ctrl+K. Busca a la vez en fichas de ayuda, glosario y recetas.',
'Acepta varias palabras: exige que estén todas y da más peso a las que aparecen en el título. Muestra hasta 20 resultados con un fragmento del contenido.',
'Cada resultado tiene Abrir, que muestra la ficha, el término o la receta exacta, e Ir a, que salta a la pestaña correspondiente.',
'📖 Glosario: 26 términos del estudio en español e inglés, cada uno con su pestaña y enlace a la ficha completa. Se abre desde Inicio.',
'🍳 Recetas: 9 flujos paso a paso que cruzan varias pestañas. Cada paso tiene un botón que te lleva al control exacto y lo resalta unos segundos.',
'Las fichas largas traen índice arriba y un botón ▲ Índice al final de cada bloque para volver sin hacer scroll.',
'🧭 Ruta guiada: en Inicio, 8 pasos que leen el estado real de tu proyecto y te dicen el siguiente paso útil, con salto al control.',
'',
'🎛 TEXTO v2 · TÍTULO Y SUBTÍTULOS',
'Una única función de layout alimenta canvas y SVG: la paridad es exacta entre lo que ves, el PNG y el SVG exportado.',
'5 presets de un toque: TikTok, YouTube, Cine, Minimal y Neón. 9 anclas de posición más el botón Centrar.',
'Perillas: tamaño, ancho, espaciado, interlineado, margen, opacidad, X e Y. En teléfono el gesto vertical hace scroll y el horizontal ajusta.',
'Relleno claro, de acento o personalizado; contorno con color, grosor y opacidad; sombra simple y doble con color, desenfoque, desplazamiento y opacidad; caja pill con color, opacidad, padding y radio.',
'Subtítulos en Render: compases por subtítulo (0 los apaga), desvincular del reloj para usar los tiempos exactos de cada línea, y retardo en milisegundos.',
'Título en Portadas: se habilita y se escribe; si lo dejas vacío usa el nombre del proyecto. La app lo superpone siempre: la IA no dibuja texto.',
'ALCANCE: SRT y VTT exportan solo texto y tiempos. ASS es una aproximación de estilo. Para el aspecto exacto, quema los subtítulos en el vídeo desde el Estudio.',
'',
'🎬 MOTOR DE RENDER',
'Fuente visual: escenas SVG, vídeo importado, o mix, con el vídeo debajo y el SVG encima.',
'Cinco capas en orden Z: fondo, lejano, medio, sujeto, luz. Cada una lleva data-depth para el parallax, data-motion para el comportamiento y data-anchor para el pivote.',
'Comportamientos que aplica el motor: float, drift, pulse, breathe, rise, spin y kenburns. La IA entrega SVG estático; el motor es dueño de toda la animación.',
'Motion ON/OFF congela capas, partículas y pulso. Perillas de motion: intensidad del pulso al reloj, glow, partículas, tamaño, variación, velocidad de deriva y matiz.',
'Corrección de imagen: opacidad, saturación, brillo, contraste, matiz, desenfoque, escala, X e Y. Reiniciar vuelve a los valores por defecto y Aleatorio propone una combinación.',
'HUD en preview y HUD en export se activan por separado. La Rejilla dibuja guías y el rectángulo de safeArea para componer.',
'Calidad de preview y calidad de WebM son independientes; la escala del Estudio es aparte. Baja la escala antes que la resolución del proyecto.',
'Las perillas no viajan a la IA como números: se traducen a cláusulas semánticas dentro del contrato para que no dibuje efectos duplicados.',
'',
'🎨 CHROMA Y TRANSPARENCIA',
'Fondos disponibles: transparente, chroma verde, chroma azul, magenta, negro, blanco y tres grises.',
'Transparente es fiable en preview y en PNG. En vídeo no lo es: usa chroma verde o azul y haz keying en tu editor.',
'Activa Ocultar capa de fondo del SVG. Sin eso, la capa fondo del arte taparía el chroma y el recorte sería imposible.',
'Por eso el contrato exige que el sujeto se lea sobre fondo plano: lleva su propio halo, su luz de borde y su sombra de contacto.',
'',
'📐 MEDIOS IMPORTADOS',
'El vídeo importado puede ser el reloj maestro: su duración define la del proyecto y suena su propia pista. Tu audio importado queda como onda de referencia.',
'Cada medio muestra una ficha permanente: resolución original con aviso de reescalado, verde nativo, ámbar hasta 1.5×, rojo severo, más peso, duración y si sigue vinculado en esta sesión.',
'Botones de vídeo: Silenciar o Sonar, Usar SVG o Usar vídeo, Ajustar al vídeo para adoptar su duración, Quitar y Re-vincular.',
'Botones de audio: Re-vincular y Quitar. Quitar un medio NO borra el proyecto, la letra ni los clips; Ctrl+Z revierte.',
'Los archivos no viajan dentro del .json: al abrir el proyecto en otra máquina hay que re-vincularlos.',
'',
'📥 COLA DE IMPORTACIÓN',
'La importación reconoce el tipo por contenido, no por extensión, y siempre muestra vista previa de qué entra y qué se reemplaza.',
'Tolera bloques de código, conversación alrededor del JSON, claves con espacios sobrantes, prólogo XML y DOCTYPE con subconjunto interno.',
'Las imágenes de referencia entran todas juntas. Los documentos se procesan de uno en uno para que cada vista previa no tape a la siguiente.',
'Si mezclas imágenes y documentos, o traes varios documentos, los restantes quedan en la cola: aparece un panel arriba de Exportar con sus nombres y los botones Importar siguiente y Vaciar cola.',
'Si un SVG traía CSS incrustado, se retira y se te avisa: pide a la IA los colores en atributos fill/stroke, no en clases.',
'',
'⚙️ CONFIGURACIÓN AVANZADA',
'Sensibilidad de perillas en píxeles por paso y divisor de modo fino; umbral de snap; zoom por defecto, inicial móvil y máximo; velocidad de zoom y scroll con rueda; sensibilidad de la barra; thumb mínimo; detalle de onda.',
'Tamaño de letra de la interfaz; volumen del metrónomo; límite de deshacer y de avisos; umbral de arrastre; ventana de doble tap; pulsación larga; bordes de resize en escritorio y móvil; techo de rasterizado; bitrate y keyframe de MP4.',
'Interruptores: límite D, metrónomo, autoguardado, UI móvil automática, JSON compacto, atajos de teclado, aviso de idioma, aviso de cuota, marcas de centinela, contrato de arte ligero LEAN o RICH, y registro de lote.',
'Fábrica restaura la configuración SIN borrar tu obra. Puedes exportar e importar un preset de ajustes para reutilizarlo.',
'El interruptor de registro de lote refresca la vista al instante; los demás ajustes de este panel se aplican al guardar.',
'',
'🎯 COBERTURA DE SECCIONES Y DE CLIPS',
'Cobertura de secciones: unión de los tramos de sección sobre la duración total. Es la cifra compacta de la barra de estado.',
'Cobertura de clips: unión de los clips sobre la duración total. Es la que exige el contrato de guion: 100% sin huecos.',
'Los solapes no inflan el resultado: se unen intervalos, no se suman duraciones.',
'Si la cobertura de clips baja de 100 aparece un aviso con salto a Generar clips. Detecta los huecos de cabeza y cola que el chequeo entre clips vecinos no ve.',
'',
'🧭 PRECEDENCIA DEL CONTRATO',
'Cuando dos reglas chocan, el contrato declara un orden y lo escribe en prosa dentro de readFirst, además de la lista precedence. Ambas salen de la misma fuente: no pueden divergir.',
'En LEAN manda clips[].dir, o coverPlan en portada; después artContract; después intent.directorContract; después intent.bible; después intent.universalPrompt.',
'En RICH el canon manda primero y outputRules entra justo después de artContract.',
'Una regla inferior nunca anula a una superior. El estilo del Prompt Universal y de las estéticas es soberano: no se trata como conflicto mecánico.',
'',
'🎬 PROYECTO DEMO',
'Al primer arranque, si no hay nada guardado, se carga un proyecto de ejemplo completo: reloj, secciones, letra, escenas, clips, motivo, planos, referencias, portada y escenas SVG.',
'Sirve para probar el motor, el chroma y la exportación sin cargar nada tuyo. Se genera en el idioma activo.',
'Tu proyecto guardado siempre tiene prioridad: la demo nunca lo sobrescribe. Nueva sesión empieza vacía, no con la demo.',
'',
'⌨ ATAJOS COMPLETOS',
'Funcionan en escritorio cuando no escribes en un campo ni hay una ventana abierta. Se desactivan en Configuración avanzada.',
'L M S C · marcar línea, sección, escena, clip. Solo actúan en la pestaña Timeline; C necesita dos pulsaciones, inicio y fin.',
'Space · play/pause · R · ciclo de loop, off, 2, 4, 8, clip, todo · coma y punto · clip anterior o siguiente · Shift con coma o punto · sección.',
'Flechas izquierda y derecha · ±1 s · con Shift · ±1 fotograma · con Alt · ±1 beat · más y menos · zoom · 0 · zoom completo.',
'B · partir clip · Alt con flechas arriba o abajo · reordenar · Alt+S · centinela · Shift con flechas · motivo · Q W · escala de plano.',
'V · fila de planos · N · fila de motivo · G · guías · E · estudio de exportación · I · importar · Ctrl+S · guardar.',
'/ o Ctrl+K · buscar · H o ? · ayuda de la pestaña · Ctrl+Z y Ctrl+Y · deshacer y rehacer · Escape · cerrar ventana.',
'',
'🛟 SI ALGO NO ARRANCA',
'Si el motor no termina de arrancar, aparece una franja roja arriba con el mensaje exacto, el archivo y la línea. Ese texto es el que hay que reportar.',
'La causa más común es un archivo incompleto: comprueba que termina en </html>. La segunda, una edición manual que dejó una cadena partida en dos líneas.',
'Tu obra no se pierde: el autoguardado y tus respaldos .json siguen intactos. Abre tu respaldo y vuelve a aplicar el cambio con cuidado.',
'',
'♿ TECLADO Y ACCESIBILIDAD',
'Los diálogos se anuncian como tales y llevan el título de la ventana. Al abrirlos, el foco entra al primer campo o botón.',
'Tab y Shift+Tab ciclan dentro del diálogo abierto y no se escapan a la página de detrás. Escape cierra.',
'Enter activa el botón enfocado; en la ficha de ayuda, Enter solo cierra si el foco está en el fondo, no sobre un control.',
'',
'📚 REFERENCIA POR PESTAÑA (las 12)',
'Cada pestaña se monta sobre el Timeline. Qué hace, controles clave y el error más común.',
'',
'🏠 INICIO','Ruta guiada de 8 pasos que lee el estado real y dice el siguiente paso útil, con botón Ir al paso.','Panel de proyecto con cobertura y contadores, actividad reciente, y accesos a Glosario y Recetas.','Error común: exportar arte antes de tener prompts; la ruta lo señala en el paso 5.',
'',
'⚙️ CONFIG','Audio y vídeo, BPM, duración total, FPS, compás, resolución y nombre. Tap Tempo de 8 toques.','Defaults de clips: duración objetivo D, solapamiento S, mínimo, snap al reloj y First-Last-Frame.','Reloj CSV: unidad, span con autodetección, offset propio, prioridad y adoptar BPM desde el CSV.','Medios importados: insignias y gestión (silenciar, usar SVG, quitar, ajustar la duración al vídeo).','Error común: pulsar Generar clips tras importar un guion de IA en modo rellenar.',
'',
'🎵 TIMELINE','Bandas: Secciones, Escenas, Clips, Líneas, Motivo, Planos, Onda, Beats/CSV y Regleta.','Marcar L/M/S/C, snap cíclico, candado D, metrónomo, motivo, planos, CSV, leyenda, seguir aguja, loop e inmersivo.','Error común: arrastrar en vertical sobre el lienzo no hace scroll de página; el Timeline captura el gesto.',
'',
'📑 SECCIONES','Arquitectura global de la canción. Añadir por tiempo o por rejilla musical; ordenar por tiempo con remapeo seguro.','Editar nombre, descripción, intérprete, estética, instrumental y tiempos. Reordenar la lista no mueve los tiempos.','Error común: borrar una sección arrastra sus líneas, clips y asignaciones; revisa antes de confirmar.',
'',
'✍️ LETRA','Plantilla .txt, importar, pegar, SRT o crear línea a línea. Compases por línea y auto energía.','Cada línea lleva texto, intérprete, energía E0-E3 y tiempos; se colorea en la banda de líneas del Timeline.','Error común: dejar una línea fuera de los límites de su sección; la validación lo avisa.',
'',
'🎬 ESCENES','Biblioteca de escenas con dirección visual, estética y ajustes propios de D, solapamiento y First-Last-Frame.','Asignar escena a sección por tramo; los clips de ese tramo heredan la escena. Las asignaciones están plegadas por defecto.','Error común: crear una escena y no asignarla; los clips no la heredan.',
'',
'🎞 CLIPS','Partición con techo D, generar, marcar visibles, centinelas, exportar centinelas y checklist .txt. Filtros por estado.','Tarjeta con Core/Gen/frames/D, estética, motivo, planos, referencias, estado y nota. Copiar prompt lo marca Enviado si estaba Pendiente.','Error común: pulsar Generar tras importar un guion de IA; re-particiona y destruye los tiempos importados.',
'',
'🖼 REFERENCIAS','Imágenes de personaje con rol: solo personaje, personaje+entorno coincidente o solo entorno. Vincular a clips y notas.','Resolución original permanente con aviso de reescalado; almacenamiento interno, IndexedDB o externo; matriz de continuidad y manifiesto .json.','Error común: esperar que la app adjunte los archivos por ti; solo te dice cuáles tocar y lleva la cuenta.',
'',
'🎨 CREATIVO','Modo de guion (autorizar o rellenar) y export del Guion para IA. Biblia del director y carga de contrato por destino.','Prompt Universal con biblioteca de presets, motivo del proyecto con leyenda, y estéticas reordenables con remapeo automático.','Error común: pedir a la IA lo que la app ya hace (subtítulos, letterbox, animación, desenfoque).',
'',
'🖼 PORTADAS SVG','Aspecto de portada, anotaciones, JSON para IA, pegar respuesta, importar, esqueleto y póster base.','Galería con ver, SVG, PNG y borrado; todas en .zip. Texto v2 superpone el título. Panel de avisos del blindaje.','Error común: recortar o estirar el vídeo para la portada en vez de re-escenificar el cartel.',
'',
'📹 RENDER SVG','Resolución, fuente visual (SVG, vídeo o mix), fondo y chroma, ocultar capa de fondo, transporte, WebM, Estudio y PNG.','JSON para IA, importar escenas, escena base, escenas a IndexedDB, quitar escenas y subtítulos SRT/VTT/ASS.','Motor de movimiento y corrección de imagen con perillas; Texto v2 para subtítulos; panel de avisos del blindaje.','Error común: pedir partículas, glow o desenfoque a la IA; el motor ya los añade y se verían dobles.',
'',
'📤 EXPORTAR','Importación inteligente por contenido, validación con avisos accionables y Self-Test.','Proyecto .json, Estudio de video, Informe .txt, Guion para IA, Referencias, Prompt Universal, Subtítulos, Marcadores, Fotograma PNG y Manual.','Error común: exportar sin reloj o sin prompts; la validación y la ruta guiada lo señalan antes.',
'',
'🔤 DICCIONARIO DE CAMPOS',
'Proyecto y reloj: projectName · bpm · offsetMs · totalDurationMs · timeSig.beats/unit · fps · res.preset/w/h · visualSource (svg|video|mix).',
'CSV: events[] (timeMs,index,label) · csv.unit (beats|bars) · csv.span · csv.auto · csv.priority · csv.offsetMs · csv.fileName.',
'Secciones: sections[] con id, name, description, interpreter, instrumental, startMs, endMs, aestheticIdx, config.',
'Líneas: lines[] con id, sectionId, text, interpreter, energy (E0-E3), startMs, endMs · barsPerLine.',
'Escenas: scenes[] con id, name, description, aestheticIdx y config (targetDuration, overlapSec, firstLastFrame, crossFLF).',
'Asignaciones: assignments[] con sceneId, sectionIdx, startMs, endMs, overrides.',
'Clips: clips[] con id, sectionIdx, sceneId, asnIdx, manual, startMs/endMs, genStartMs/genEndMs, coreStartMs/coreEndMs, coreDurMs, genDurMs, S, frames, D, firstLastFrame, firstFrameFrom.',
'Por clip: clipDescriptions{id:texto} · clipAesthetics{id:índice} · clipStatus{id:{stage,note,at}} · clipMeta{id:{motif,shot,camera,sentinel,shotSrc}}.',
'Estéticas: aesthetics[] con name y content; el índice se remapea al reordenar o borrar.',
'Creativo: bible · universalPrompt · universalPromptTitle · scriptMode (author|fill).',
'Motivo: motif.name · motif.legend{M0..M11:{label,desc}}; colores e iconos fijos, significado por proyecto.',
'Canon: canon.characters/sets/motifs[] con id, name, svg (grupo reutilizable) y palette congelada.',
'Referencias: refs[] con id, name, fileName, role (character|character-env|environment), w, h, bytes, mime, store (internal|idb|external), notes, clips[], dataUrl.',
'Medios: media.video{name,w,h,bytes,durationMs,mime} · media.audio{name,bytes,mime,durationMs,sampleRate,channels}.',
'Defaults: globalConfig{targetDuration,overlapSec,snapToBeat,firstLastFrame,minClipDur,minClipOn}.',
'Portadas: covers.brief · covers.aspect{w,h,preset} · covers.items[] · covers.title{enabled,text}.',
'Render: render.clipScenes{id:{svg,title,store,bytes,lint}} · annotations · subBars · subUnlink · subDelayMs · bg · hideSvgBg.',
'IDs y banderas: nextId{sec,scn,line,ref} · flags.aiScriptImported.',
'Contrato para IA: type · version · readFirst · project · intent{bible,directorContract,universalPrompt,aesthetics,annotations,motif} · refs · subtitles.safeArea · clips · artContract · precedence · batch · outputSchema · outputRules · _integrity.',

'======================================================','  USER MANUAL · SenySync Studio · Build 1 · v1','  By Seny Clever','======================================================','',

'🧭 WHAT IT IS','Local 4-in-1 studio for AI music videos: lyrics and timing, cinematic script, animated SVG Render, SVG Covers and compositing over real video.','Everything runs in your browser: no servers, no accounts, no uploads, no external libraries. Works on desktop and phone.','',
'⭐ EVERYTHING REVOLVES AROUND THE TIMELINE','Settings defines the clock (BPM or CSV) or the imported video defines it for you. Sections are the global architecture; Lyrics, Scenes, Clips, Motif, Shots and References mount on it.','',
'🚀 FLOW A (the AI creates the clips)','1) Settings: audio or video, clock, duration, FPS, resolution. 2) Sections. 3) Lyrics. 4) Creative: bible and universal prompt. 5) Export AI Script in AUTHOR mode. 6) Import the JSON. Do NOT press Generate afterwards.','Always remember to save your project in "📥 Export / 💾 Project .json" after each step. You can later import your progress with that file.','',
'🚀 FLOW B (you create the clips)','1) Sections. 2) Clip defaults (Target duration). 3) Generate Clips. 4) Lyrics. 5) Export AI Script in FILL mode: your clips travel locked and the AI only writes prompts, scenes and aesthetics. 6) Import choosing Keep my clips.','Always remember to save your project in "📥 Export / 💾 Project .json" after each step. You can later import your progress with that file.','',
'🥁 BPM / CSV CLOCK','The Sonic Visualiser CSV can drive the clock just like BPM, with an irregular grid that follows the real tempo.','Sonic Visualiser: File / Open → Transform / Analysis by Category / Time / Tempo / Bar and Beat Tracker: Bars → File / Export Annotation Layer.','State whether each row is a BEAT or a BAR. Bars often delivers one row every 1 or 2 bars: with Auto span the app compares the CSV median with the BPM bar and deduces it.','The CSV has its OWN offset, independent from BPM, to correct the small detection error.','Hierarchy: BPM wins by default when both are loaded; you can invert it. With no BPM, the CSV wins automatically.','The app warns when CSV and BPM disagree, and offers Adopt BPM from CSV.','',
'🎵 TIMELINE','Bands: Sections · Scenes · Clips · Lines · [Motif] · [Shots] · Waveform · Beats/CSV · Ruler.','Each bar label is clipped inside its own rectangle: it never invades the neighbouring bar.','Wheel = zoom · Alt/Shift+wheel = scroll · two fingers = pinch · long press = menu · double tap = zoom to selection · vibration on snap.','Tapping the Motif or Shots lane opens its editor directly.','',
'🎯 MOTIF LANE','Continuity map of the recurring symbol. 12 fixed codes M0–M11, each with its own color and glyph, identical across projects.','The MEANING is per project: you write it or the AI defines it and it arrives in the JSON. Press Legend to see and edit it.','M11 Exception should appear only once; the app warns if repeated.','','🔁 LOOP','Cycle: Off → 2 bars → 4 bars → 8 bars → Clip → All. Loop button or R key.','Bar modes respect the Config time signature and the active grid (BPM or CSV): they anchor to the musical bar at or before the playhead, and re-anchor on seek.','The loop window shows on the Timeline as a faint band with dashed edges. The toast shows the mode and its duration.','The loop is guaranteed by the audio thread: the playhead never escapes even if you switch tabs.','',
'🧲 SNAP AND 🔒 LOCK','Snap is a single cycled button: Free → Edges → Beat → Bar → All. Each change shows a one-word toast and vibrates on snap.','The Lock (🔒 D) blocks resizing beyond the target duration ceiling: toast "Locked to target duration" or "Free duration".','',
'🎯 FOLLOW PLAYHEAD','With Follow on, playback scrolls the Timeline to keep the playhead in view when it leaves the central 60%. It only acts when zoom > 1.','If you move the scrollbar by hand you can turn Follow off to avoid fighting the view. The button shows the active state.','',
'🛡 WARNING PANELS','At the bottom of SVG Render and SVG Covers there is a "🛡 Armor warnings (N)" panel, collapsed by default. Expand with ▼ to see detail per clip or per cover.','On mobile the detail uses internal scroll (40vh) so it does not take the whole screen. Amber = warning; red = defect.','It updates itself when you re-import SVG scenes and clears when you delete a cover. They are mechanical facts, not a creative judgment.','',
'🎬 SHOTS LANE','Closed vocabulary in six categories: scale, angle, point of view, subjects, movement and editing function.','Canonical order SIZE/ANGLE/POV/CAST/MOVE/FUNC omitting neutrals: PM / ESC / FIJ.','Fed by the AI, inferred from the prompt, or set by hand. Optional and hidden by default.','To learn each code (GPG, PM, PP, ESC, CTP…) press the Shots ? icon: it opens a complete guide with every shot type described and how to shoot it.','It helps spot monotony (4+ consecutive clips with the same scale), new scenes without an establishing shot and climax without a close-up.','',
'★ SENTINELS','Mark three test clips (hero+set, entity+chaos, climax) and export only those. If they pass your review, the batch will be coherent.','They are not new clips: they are flags on existing clips. They keep their original IDs on export.','',
'✅ CHECKLIST','Each clip has a stage: Pending → Sent → Generated → Approved / Rejected, with a note. The bar counts APPROVED only.','Filter by stage before each generation session. Export the checklist as .txt.','',
'↑↓ REORDERING CLIPS','Mode 1 · Swap content: times do NOT move; prompt, aesthetic, SVG scene, motif, shots, stage and references travel. Zero risk.','Mode 2 · Move in time: they exchange position while each keeps its duration; boundaries, section, scene and first-frame are recomputed.','The app always asks and explains. Ctrl+Z undoes.','',
'✂ SPLIT CLIP','If a clip exceeds D, the app offers splitting at the nearest bar, beat, lyric line start or a manual point.','Aesthetic, references, motif, shots and notes migrate. The SVG scene can be duplicated or left pending. The stage returns to Pending unless you keep it.','',
'🖼 REFERENCES','The app cannot attach files for you: it tells you which ones apply to each clip and keeps count. Roles: character-only, character+matching environment, environment-only.','Every card permanently shows the ORIGINAL resolution: green native, amber mild upscale, red severe.','The continuity matrix (clips × references) verifies at a glance that a character does not appear earlier than the bible dictates.','',
'💾 WHERE DATA LIVES','INTERNAL: inside the .json. One file contains everything; ideal to archive. Heavier.','IN THIS BROWSER (IndexedDB): light project, no practical limit; ideal while iterating. Exists only in this browser.','EXTERNAL: record only (name, resolution, weight). The lightest; on another machine you must re-link.','The status bar shows the autosave size and warns before it fills.',
'',
'📒 LOCAL LEDGERS (OPTIONAL)',
'Two ledgers off by default, only in this browser, under keys separate from the project. They are never uploaded and store no content of your work.',
'Usage ledger (panel in Export): tabs visited, actions, help cards opened, warnings by type, exports by format and confirmed or failed imports.',
'Batch ledger (panel in Export and switch in Advanced settings): links each export with its later import. It stores LEAN or RICH mode, clip count, sentinel flag, hand-tagged model, return time, valid scenes over total and aggregated armor warnings.',
'In a Script batch the scenes are narrative and the armor counter is 0 because the SVG armor does not apply to a script: that 0 means not applicable, not audited and clean.',
'Export ledger downloads a JSON with counts and events. Purging deletes only its own key; your project and your work are untouched. Disabling purges, for privacy.',
'The project backup includes neither ledger.','',
'📤 AI CONTRACTS · LEAN AND RICH','AI Script is the master contract: it keeps the musical layer, narrative, clips, aesthetics, motif, shots, references and canon. It is the one that lets nothing escape.','SVG Render and SVG Cover have two modes with the "Lean art contract" switch (Advanced settings):','· LEAN (default): proven minimal contract. Clips carry dir, aesthetic and a narrative spine (section, scene and lines with the lyric crossing the clip), project bible, brief director contract, universal prompt, aesthetics, motif, refs and safeArea. Less context = more attention on drawing. Recommended for art.','· RICH: adds story (sections, scenes, assignments, lyrics with energy), full canon (model sheets) and shot taxonomy. Use it when you need maximum unification or work in batches with canon.','In both modes the director contract ALWAYS travels as intent.directorContract, separate from your notes (intent.bible).','JSON language follows the interface; in Spanish the app offers switching to English for that export only.','',
'🧬 CANON','The canon (canon.characters/sets/motifs) are reusable model sheets: one continuous anatomy per character, head joined to torso, legs joined to torso, frozen palette.','The script AI returns it and the app stores it in the project. In RICH mode it is injected into render and cover so the same design repeats byte-identical (only translate/scale and light).','If canon is empty, the AI builds it at clip 1 and returns it in result.canon.','',
'🎨 FINISH, STAGING AND COLOR','The director contract asks for: silhouette first, detail second; readable materials (stone, metal, cloth, feather, skin); gradient volume, rim light and contact shadow; clean paths.','Staging: each character in its own readable zone, no accidental overlap of wings, arms or props unless the script asks. Props anchored to the hand. Nothing floats without reason.','Color: one show LUT, frozen character colors, temperature/value per aesthetic, light via multiply/screen. Vivid cohesive color, not dirty neon.','The style is defined by YOUR Universal Prompt and YOUR aesthetics; the app does not impose a house finish.','',
'🤖 WHICH MODEL TO USE FOR ART','Drawing SVG blind is hard for an LLM. Use a model strong in spatial SVG (for example Gemini, the one that produced the good castle) for Render and Cover.','Weaker models tend to geometric primitives. If you use them, work in LEAN and in small batches by scene or family, never 33 clips at once.','Geometric finish is not an app failure: it is model capability. The app guarantees integrity, continuity and a clean contract; the model supplies the drawing talent.','',
'💬 SUBTITLES AND SAFE AREA','Lyrics travel as story.lines[].text with energy E0-E3 (in RICH). The app overlays subtitles: the AI never draws text.','safeArea is the lower band where lyrics will go: the AI must keep it clean and low-contrast, as a continuation of the set, never a flat black band.','Figures stand on a ground line ABOVE safeArea, with a small contact shadow.','',
'🛡 ARMOR LEVEL 2','It is a read-only, non-blocking audit. It does not judge beauty or narrative: it checks mechanical facts.','On EXPORT: verifies the request carries directorContract, universalPrompt, artContract, safeArea (render) and aspect/coverPlan/title (cover), and that no clip is left without dir. If something is missing, it warns in notifications but exports anyway.','On IMPORT: checks that the SVG parses, has the five layers with data-depth and data-anchor (render) or free groups (cover), carries no text, scripts, animation or external resources, that the viewBox is normalized, and that there is no giant halo/ellipse or ground as a flat hard-cut rect.','Warnings appear in notifications and in the toast (🛡). It never rejects or modifies the SVG. If the armor fails, the normal flow continues.','',
'🎬 EXPORT STUDIO','MP4 H.264: WebCodecs plus a native MP4 muxer. OFFLINE frame-by-frame render with no dropped frames. Video only.','WebM VP9/VP8 + Opus: realtime recording with audio.','PNG sequence in ZIP in configurable chunks (24, 60, 120 or 240 frames; 60 by default) so phone memory is never exhausted.','The capability report tests your browser before offering each format. After a WebM finishes the app offers opening the Studio to produce an MP4: it is a fresh render from the project, not a conversion of the WebM.','',
'🎛 KNOBS ON PHONE','Vertical gesture scrolls the page; horizontal adjusts the value. Single tap: editor with a large slider, −/+ and a numeric field.','Double tap: default value. Shift or switch: fine mode. Wheel and arrows also work.','',
'❓ HELP AND SHORTCUTS','Every "?" icon opens a card with what it is, why it matters and how it connects to the Timeline.','Press H or ? for tab help, or the key icon for all shortcuts. They can be disabled in Advanced settings.','',
'🧰 TROUBLESHOOTING','No audio on first click: press play again. Gaps: check Validation. Red: the clip exceeds D, split it.','Autosave full: move scenes to IndexedDB or export a .json backup.','Heavy export: lower the Studio scale before project resolution.','MP4 missing: your browser cannot encode H.264; use WebM or PNG.','Geometric or unfinished characters: switch to a strong SVG model, use LEAN and small batches.','🛡 warnings on import: check notifications; they are mechanical facts, not a creative judgment.','',

'🔎 SEARCH, GLOSSARY AND RECIPES',
'The magnifier in the header, between Import and Shortcuts, opens the cross-search. Shortcuts: / or Ctrl+K. It searches help cards, glossary and recipes at once.',
'It accepts several words: all of them must be present, and words found in the title weigh more. It shows up to 20 results with a fragment of the content.',
'Every result has Open, which shows the exact card, term or recipe, and Go to, which jumps to the matching tab.',
'📖 Glossary: 26 studio terms in Spanish and English, each with its tab and a link to the full card. It opens from Home.',
'🍳 Recipes: 9 step-by-step flows across several tabs. Every step has a button that takes you to the exact control and highlights it for a few seconds.',
'Long cards carry an index at the top and a ▲ Index button at the end of each block to go back without scrolling.',
'🧭 Guided route: on Home, 8 steps that read the real state of your project and tell you the next useful step, with a jump to the control.',
'',
'🎛 TEXT v2 · TITLE AND SUBTITLES',
'One layout function feeds canvas and SVG: parity is exact across what you see, the PNG and the exported SVG.',
'5 one-tap presets: TikTok, YouTube, Cinema, Minimal and Neon. 9 position anchors plus the Center button.',
'Knobs: size, width, spacing, line height, margin, opacity, X and Y. On phone the vertical gesture scrolls and the horizontal one adjusts.',
'Light, accent or custom fill; outline with color, width and opacity; single and double shadow with color, blur, offset and opacity; pill box with color, opacity, padding and radius.',
'Subtitles in Render: bars per subtitle (0 turns them off), unlink from the clock to use the exact times of each line, and delay in milliseconds.',
'Title in Covers: enable it and write it; if you leave it empty it uses the project name. The app always overlays it: the AI does not draw text.',
'SCOPE: SRT and VTT export text and timing only. ASS is a style approximation. For the exact look, burn the subtitles into the video from the Studio.',
'',
'🎬 RENDER ENGINE',
'Visual source: SVG scenes, imported video, or mix, with the video underneath and the SVG on top.',
'Five layers in Z order: fondo, lejano, medio, sujeto, luz. Each carries data-depth for parallax, data-motion for behavior and data-anchor for the pivot.',
'Behaviors the engine applies: float, drift, pulse, breathe, rise, spin and kenburns. The AI delivers static SVG; the engine owns all animation.',
'Motion ON/OFF freezes layers, particles and pulse. Motion knobs: clock pulse intensity, glow, particles, size, variation, drift speed and hue.',
'Image correction: opacity, saturation, brightness, contrast, hue, blur, scale, X and Y. Reset returns to defaults and Random proposes a combination.',
'Preview HUD and export HUD are enabled separately. Grid draws guides and the safeArea rectangle for composing.',
'Preview quality and WebM quality are independent; the Studio scale is separate. Lower the scale before the project resolution.',
'Knobs do not travel to the AI as numbers: they are translated into semantic clauses inside the contract so it does not draw duplicated effects.',
'',
'🎨 CHROMA AND TRANSPARENCY',
'Available backgrounds: transparent, green chroma, blue chroma, magenta, black, white and three grays.',
'Transparent is reliable in preview and PNG. On video it is not: use green or blue chroma and key it in your editor.',
'Enable Hide SVG background layer. Without it the art background layer would cover the chroma and keying would be impossible.',
'That is why the contract requires the subject to read over a flat background: it carries its own halo, rim light and contact shadow.',
'',
'📐 IMPORTED MEDIA',
'Imported video can be the master clock: its duration defines the project duration and it plays its own track. Your imported audio stays as a reference waveform.',
'Each medium shows a permanent record: original resolution with an upscale flag, green native, amber up to 1.5×, red severe, plus weight, duration and whether it is still linked in this session.',
'Video buttons: Mute or Unmute, Use SVG or Use video, Match video to adopt its duration, Remove and Re-link.',
'Audio buttons: Re-link and Remove. Removing a medium does NOT delete the project, the lyrics or the clips; Ctrl+Z undoes.',
'Files do not travel inside the .json: on another machine you must re-link them.',
'',
'📥 IMPORT QUEUE',
'Import recognizes the type by content, not by extension, and always shows a preview of what comes in and what gets replaced.',
'It tolerates code blocks, conversation around the JSON, keys with trailing spaces, an XML prolog and a DOCTYPE with an internal subset.',
'Reference images come in all together. Documents are processed one at a time so each preview does not cover the next one.',
'If you mix images and documents, or bring several documents, the rest stay in the queue: a panel appears at the top of Export with their names and the buttons Import next and Clear queue.',
'If an SVG carried embedded CSS, it is removed and you are warned: ask the AI for colors in fill/stroke attributes, not in classes.',
'',
'⚙️ ADVANCED SETTINGS',
'Knob sensitivity in pixels per step and fine mode divisor; snap threshold; default, mobile initial and max zoom; wheel zoom and scroll speed; bar sensitivity; minimum thumb; waveform detail.',
'Interface font size; metronome volume; undo and notification limits; drag threshold; double tap window; long press; desktop and mobile resize edges; raster cap; MP4 bitrate and keyframe.',
'Switches: limit D, metronome, autosave, auto mobile UI, compact JSON, keyboard shortcuts, language warning, quota warning, sentinel marks, lean art contract LEAN or RICH, and batch ledger.',
'Factory restores the configuration WITHOUT deleting your work. You can export and import a settings preset to reuse it.',
'The batch ledger switch refreshes the view instantly; the other settings in this panel apply on save.',
'',
'🎯 SECTION AND CLIP COVERAGE',
'Section coverage: union of the section spans over the total duration. It is the compact figure in the status bar.',
'Clip coverage: union of the clips over the total duration. It is what the script contract demands: 100% with no gaps.',
'Overlaps do not inflate the result: intervals are united, durations are not added.',
'If clip coverage drops below 100 a warning appears with a jump to Generate clips. It catches head and tail gaps that the check between neighbouring clips does not see.',
'',
'🧭 CONTRACT PRECEDENCE',
'When two rules clash, the contract declares an order and writes it in prose inside readFirst, in addition to the precedence list. Both come from the same source: they cannot diverge.',
'In LEAN, clips[].dir rules first, or coverPlan for covers; then artContract; then intent.directorContract; then intent.bible; then intent.universalPrompt.',
'In RICH the canon rules first and outputRules comes right after artContract.',
'A lower rule never overrides a higher one. Style from the Universal Prompt and the aesthetics is sovereign: it is not treated as a mechanical conflict.',
'',
'🎬 DEMO PROJECT',
'On first start, if nothing is saved, a complete example project is loaded: clock, sections, lyrics, scenes, clips, motif, shots, references, cover and SVG scenes.',
'It lets you test the engine, chroma and export without loading anything of yours. It is generated in the active language.',
'Your saved project always takes priority: the demo never overwrites it. New session starts empty, not with the demo.',
'',

'/ or Ctrl+K · search · H or ? · tab help · Ctrl+Z and Ctrl+Y · undo and redo · Escape · close window.',
'',
'🛟 IF SOMETHING DOES NOT START',
'If the engine does not finish starting, a red banner appears at the top with the exact message, the file and the line. That text is what you should report.',
'The most common cause is an incomplete file: check that it ends with </html>. The second is a manual edit that left a string split across two lines.',

'🏠 HOME','Guided route of 8 steps that reads the real state and tells the next useful step, with a Go to step button.','Project panel with coverage and counters, recent activity, and access to Glossary and Recipes.','Common mistake: exporting art before having prompts; the route flags it at step 5.',

'⚙️ SETTINGS','Audio and video, BPM, total duration, FPS, time signature, resolution and name. 8-tap Tap Tempo.','Clip defaults: target duration D, overlap S, minimum, snap to clock and First-Last-Frame.','CSV clock: unit, span with auto-detection, own offset, priority and adopt BPM from the CSV.','Imported media: badges and management (mute, use SVG, remove, match the video duration).','Common mistake: pressing Generate clips after importing an AI script in fill mode.',

'🎵 TIMELINE','Bands: Sections, Scenes, Clips, Lines, Motif, Shots, Waveform, Beats/CSV and Ruler.','Mark L/M/S/C, cycled snap, lock D, metronome, motif, shots, CSV, legend, follow playhead, loop and immersive.','Common mistake: dragging vertically over the canvas does not scroll the page; the Timeline captures the gesture.',
'',
'📑 SECTIONS','Global architecture of the song. Add by time or by musical grid; sort by time with safe remapping.','Edit name, description, interpreter, aesthetic, instrumental and times. Reordering the list does not move times.','Common mistake: deleting a section pulls its lines, clips and assignments; review before confirming.',

'✍️ LYRICS','.txt template, import, paste, SRT or create line by line. Bars per line and auto energy.','Each line carries text, interpreter, energy E0-E3 and times; it is colored on the Timeline line band.','Common mistake: leaving a line outside its section bounds; validation warns about it.',
'',
'🎬 SCENES','Scene library with visual direction, aesthetic and own settings for D, overlap and First-Last-Frame.','Assign scene to section by span; clips in that span inherit the scene. Assignments are collapsed by default.','Common mistake: creating a scene and not assigning it; clips do not inherit it.',
'',
'🎞 CLIPS','Partition with ceiling D, generate, mark visible, sentinels, export sentinels and checklist .txt. Filters by stage.','Card with Core/Gen/frames/D, aesthetic, motif, shots, references, stage and note. Copying the prompt marks it Sent if it was Pending.','Common mistake: pressing Generate after importing an AI script; it re-partitions and destroys imported timing.',
'',
'🖼 REFERENCES','Character images with role: character-only, character+matching environment or environment-only. Link to clips and notes.','Permanent original resolution with upscale flag; internal, IndexedDB or external storage; continuity matrix and .json manifest.','Common mistake: expecting the app to attach files for you; it only tells you which ones apply and keeps count.',
'',
'🎨 CREATIVE','Script mode (author or fill) and AI Script export. Director bible and contract loading per target.','Universal Prompt with preset library, project motif with legend, and reorderable aesthetics with automatic remapping.','Common mistake: asking the AI for what the app already does (subtitles, letterbox, animation, blur).',
'',
'🖼 SVG COVERS','Cover aspect, notes, AI JSON, paste reply, import, skeleton and base poster.','Gallery with view, SVG, PNG and delete; all in .zip. Text v2 overlays the title. Armor warnings panel.','Common mistake: cropping or stretching the video for the cover instead of re-staging the poster.',
'',
'📹 SVG RENDER','Resolution, visual source (SVG, video or mix), background and chroma, hide background layer, transport, WebM, Studio and PNG.','AI JSON, import scenes, base scene, scenes to IndexedDB, remove scenes and SRT/VTT/ASS subtitles.','Motion engine and image correction with knobs; Text v2 for subtitles; armor warnings panel.','Common mistake: asking the AI for particles, glow or blur; the engine already adds them and they would double.',
'',
'📤 EXPORT','Smart import by content, validation with actionable warnings and Self-Test.','Project .json, Video studio, Report .txt, AI Script, References, Universal Prompt, Subtitles, Markers, PNG frame and Manual.','Common mistake: exporting without a clock or without prompts; validation and the guided route flag it first.',
'',
'🔤 FIELD DICTIONARY',
'Project and clock: projectName · bpm · offsetMs · totalDurationMs · timeSig.beats/unit · fps · res.preset/w/h · visualSource (svg|video|mix).',
'CSV: events[] (timeMs,index,label) · csv.unit (beats|bars) · csv.span · csv.auto · csv.priority · csv.offsetMs · csv.fileName.',
'Sections: sections[] with id, name, description, interpreter, instrumental, startMs, endMs, aestheticIdx, config.',
'Lines: lines[] with id, sectionId, text, interpreter, energy (E0-E3), startMs, endMs · barsPerLine.',
'Scenes: scenes[] with id, name, description, aestheticIdx and config (targetDuration, overlapSec, firstLastFrame, crossFLF).',
'Assignments: assignments[] with sceneId, sectionIdx, startMs, endMs, overrides.',
'Clips: clips[] with id, sectionIdx, sceneId, asnIdx, manual, startMs/endMs, genStartMs/genEndMs, coreStartMs/coreEndMs, coreDurMs, genDurMs, S, frames, D, firstLastFrame, firstFrameFrom.',
'Per clip: clipDescriptions{id:text} · clipAesthetics{id:index} · clipStatus{id:{stage,note,at}} · clipMeta{id:{motif,shot,camera,sentinel,shotSrc}}.',
'Aesthetics: aesthetics[] with name and content; the index is remapped when reordering or deleting.',
'Creative: bible · universalPrompt · universalPromptTitle · scriptMode (author|fill).',
'Motif: motif.name · motif.legend{M0..M11:{label,desc}}; fixed colors and glyphs, per-project meaning.',
'Canon: canon.characters/sets/motifs[] with id, name, svg (reusable group) and frozen palette.',
'References: refs[] with id, name, fileName, role (character|character-env|environment), w, h, bytes, mime, store (internal|idb|external), notes, clips[], dataUrl.',
'Media: media.video{name,w,h,bytes,durationMs,mime} · media.audio{name,bytes,mime,durationMs,sampleRate,channels}.',
'Defaults: globalConfig{targetDuration,overlapSec,snapToBeat,firstLastFrame,minClipDur,minClipOn}.',
'Covers: covers.brief · covers.aspect{w,h,preset} · covers.items[] · covers.title{enabled,text}.',
'Render: render.clipScenes{id:{svg,title,store,bytes,lint}} · annotations · subBars · subUnlink · subDelayMs · bg · hideSvgBg.',
'IDs and flags: nextId{sec,scn,line,ref} · flags.aiScriptImported.',
'AI contract: type · version · readFirst · project · intent{bible,directorContract,universalPrompt,aesthetics,annotations,motif} · refs · subtitles.safeArea · clips · artContract · precedence · batch · outputSchema · outputRules · _integrity.',
'SVG layers: five groups with id fondo/lejano/medio/sujeto/luz and attributes data-depth (0..1), data-motion (float|drift|pulse|breathe|rise|spin) and data-anchor (x,y).',
'safeArea: {x,y,w,h} as fractions of the canvas, computed from text position and size; the AI reserves it and the app writes on top.',
'',
'🛡 WARNING CATALOG AND REMEDY',
'Warnings are mechanical facts, not creative judgments. None of them blocks: the app warns and you decide.',
'',
'Validation (top bar and Export):',
'· No clock → set BPM or import the beat CSV (Settings).',
'· Total duration not set → set it or load the audio (Settings).',
'· No sections → create the song architecture (Sections).',
'· No clips → generate clips or ask the AI to create them (Clips / Creative).',
'· Clips exceed ceiling D → split the clip on a musical boundary (Clips).',
'· Line outside section → adjust its times inside the section (Lyrics).',
'· Gaps between clips → review the partition or move clips (Clips).',
'· CSV and BPM differ → decide priority or adopt BPM from the CSV (Settings).',
'· Mechanical conflicts in the Universal Prompt → use Fix or rewrite (Creative).',
'· Motif M11 repeated → the exception must be unique (Creative / Legend).',
'· Project duration ≠ video → Match video (Settings / Media).',
'· Video and audio together → the video is the master clock; your audio is a reference waveform (Settings).',
'· Video source not linked → re-link or switch back to SVG (Settings / Media).',
'',
'Armor on SVG import (panels in Render and Covers):',
'· Empty / unparseable / invalid SVG → the file is not a readable SVG; export it again.',
'· no viewBox → add a normalized viewBox 0 0 480 H.',
'· missing layer fondo/lejano/medio/sujeto/luz → deliver the five tagged layers.',
'· layer without data-depth / data-anchor → add the per-layer attributes.',
'· empty sujeto layer → the subject must carry visible geometry.',
'· viewBox not normalized → use width 480 and proportional height.',
'· ground as flat rect (hard cut) → continue the set to the bottom edge, no flat band.',
'· text drawn inside the SVG → the AI does not draw text; reserve safeArea.',
'· embedded animation or script → deliver static SVG; the engine animates.',
'· external resource referenced → the SVG must be self-contained.',
'· layer without data-motion → add the data-motion attribute per layer.',
'· embedded feGaussianBlur blur → depth comes from opacity and gradients; remove the blur.',
'· more than 3 filters → reduce to 3 filters at most.',
'· embedded CSS (style) removed → ask for colors in fill/stroke attributes, not CSS classes.',
'· large halo/ellipse → reduce the halo behind the subject.',
'· no composition groups (cover) → organize the cover in Z groups.',
'',
'Armor on request export:',
'· no directorContract / universalPrompt / artContract → the contract travels incomplete; review Creative.',
'· no clips / clips without dir → some clip is missing its visual script.',
'· no safeArea (render) / no aspect / coverPlan / title (cover) → contract fields are missing.',
'',
'Prompt conflicts (Creative):',
'· Asking for animation, baked letterbox, drawn subtitles, external resources or blur → the app already does it; remove it from the Universal Prompt.',
'· photoreal / no cartoon / painterly → they are your style decisions, NOT conflicts.',
'',
'📦 EXPORT FORMATS',
'Project .json → {app,author,version,build,savedAt,cfg,project}. Full backup; imported with Import.',
'AI Script → type senysync-script-request; reply senysync-script-result {scenes,assignments,clips,clipDescriptions,clipAesthetics,clipMeta,aesthetics,motif,canon,bible}.',
'SVG Render for AI → type senysync-render-request; reply senysync-render-result {clipScenes{id:{svg,title}},lut,sequences}. LEAN or RICH.',
'SVG Cover for AI → type senysync-covers-request; reply senysync-covers-result {items[{id,title,kind,svg,width,height}],lut}.',
'Skeletons → render/covers request with one example clip or cover and _integrity{clips:1}.',
'References .json → type senysync-refs {refs[{id,name,role,fileName,w,h,bytes,clips,notes}]}. Record only; re-link the image.',
'Universal Prompt .json → type senysync-uprompt-pack {presets[{id,name,body}]}.',
'Preset .json → type senysync-preset {cfg,globalConfig}.',
'Lyrics .txt → #SENYSYNC_LYRICS v1 with [SECTION] and numbered lines; SRT/VTT/ASS with times and applied delay.',
'Report .txt → human reading: clock, bible, prompt, motif, refs, aesthetics, lyrics, clips and summary.',
'Markers → universal, youtube, resolve, premiere, blender (.py), capcut, nle (XML).',
'Video → MP4 H.264 (offline, video only), WebM (realtime, with audio), PNG in ZIP batches.',
'PNG frame → current frame at full resolution with real alpha.',
'Manual → TXT and PDF, bilingual.',
'Version 1 · Build 1. Continuous local autosave (green dot).'
].join('\n');

function knob(k,l,mn,mx,st,df){
var v=CFG[k],fr=clamp((v-mn)/(mx-mn),0,1),C=2*Math.PI*40,arc=0.75*C,an=(135+fr*270)*Math.PI/180,px=50+38*Math.cos(an),py=50+38*Math.sin(an);
return '<div class="knob" data-knob="'+k+'" data-min="'+mn+'" data-max="'+mx+'" data-step="'+st+'" data-def="'+df+'" tabindex="0" role="slider" aria-label="'+h(l)+'" aria-valuenow="'+v+'"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--panel3)" stroke-width="8" stroke-dasharray="'+arc+' '+C+'" transform="rotate(135 50 50)" stroke-linecap="round"/><circle class="ka" cx="50" cy="50" r="40" fill="none" stroke="var(--cyan)" stroke-width="8" stroke-dasharray="'+(fr*arc)+' '+C+'" transform="rotate(135 50 50)" stroke-linecap="round"/><line class="kp" x1="50" y1="50" x2="'+px.toFixed(2)+'" y2="'+py.toFixed(2)+'" stroke="var(--magenta)" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="50" r="6" fill="var(--panel2)" stroke="var(--border)"/></svg><div class="knob-val">'+v+'</div><div class="knob-lbl">'+h(l)+'</div></div>';
}
function updateKnob(el){
var k=el.getAttribute('data-knob'),mn=+el.getAttribute('data-min'),mx=+el.getAttribute('data-max'),v=CFG[k],fr=clamp((v-mn)/(mx-mn),0,1),C=2*Math.PI*40,arc=0.75*C,an=(135+fr*270)*Math.PI/180;
var a=el.querySelector('.ka');if(a)a.setAttribute('stroke-dasharray',(fr*arc)+' '+C);
var p=el.querySelector('.kp');if(p){p.setAttribute('x2',(50+38*Math.cos(an)).toFixed(2));p.setAttribute('y2',(50+38*Math.sin(an)).toFixed(2));}
var t=el.querySelector('.knob-val');if(t)t.textContent=v;
el.setAttribute('aria-valuenow',v);
}

function bindKnobs(){
var l=document.querySelectorAll('[data-knob]');
for(var i=0;i<l.length;i++)(function(el){
if(el._b)return;el._b=true;
var k=el.getAttribute('data-knob'),mn=+el.getAttribute('data-min'),mx=+el.getAttribute('data-max'),st=+el.getAttribute('data-step'),df=+el.getAttribute('data-def');
var sx=0,sy=0,sv=0,mode=null,fine=false,pid=null,snap=null;
function setV(v){v=clamp(Math.round(v/st)*st,mn,mx);CFG[k]=+v.toFixed(4);updateKnob(el);if(k.indexOf('txt')===0)UI.thumbVer++;refreshVisual();}
el.addEventListener('pointerdown',function(e){
if(e.button!==undefined&&e.button!==0)return;
sx=e.clientX;sy=e.clientY;sv=CFG[k];mode=null;fine=e.shiftKey;pid=e.pointerId;snap=clone({S:S,CFG:CFG});
});
el.addEventListener('pointermove',function(e){
if(pid!==e.pointerId)return;
var dx=e.clientX-sx,dy=e.clientY-sy;
if(!mode){
if(Math.abs(dx)>6&&Math.abs(dx)>Math.abs(dy)){mode='h';try{el.setPointerCapture(e.pointerId);}catch(x){}vibrate(6);}
else if(Math.abs(dy)>8){mode='v';pid=null;snap=null;}
return;
}
if(mode!=='h')return;
e.preventDefault();
var pps=Math.max(1,CFG.knobPxPerStep)*(fine?CFG.knobFineDiv:1);
setV(sv+(dx/pps)*st);
});
function end(e){
if(pid!==e.pointerId&&mode!=='h'){pid=null;snap=null;return;}
